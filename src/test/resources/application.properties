spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.seed.enabled=false
app.admin.email=test-admin@invoicehub.cloud
resend.api.key=re_test_api_key_123456789
resend.from.email=noreply@invoicehub.cloud
resend.reply-to=ibrahim12hal@gmail.com

# Disable CSRF for login-flow integration tests
spring.security.test.csrf.disabled=true

rate-limiting.enabled=true
rate-limiting.behind-proxy=true

rate-limiting.global.capacity=60
rate-limiting.global.refill-tokens=60
rate-limiting.global.refill-period-minutes=1

rate-limiting.auth.capacity=5
rate-limiting.auth.refill-tokens=5
rate-limiting.auth.refill-period-minutes=1

rate-limiting.contact.capacity=3
rate-limiting.contact.refill-tokens=3
rate-limiting.contact.refill-period-minutes=1

rate-limiting.register.capacity=5
rate-limiting.register.refill-tokens=5
rate-limiting.register.refill-period-minutes=1

rate-limiting.dev-mail.capacity=3
rate-limiting.dev-mail.refill-tokens=3
rate-limiting.dev-mail.refill-period-minutes=1
