help.register.title=Cara Mendaftar
help.register.intro=Jika Anda vendor baru, Anda dapat mendaftar di platform InvoiceHub untuk mulai mengirim tagihan dan mengelola tiket.
help.register.step1.title=Klik tombol Daftar
help.register.step1.desc=Kunjungi halaman login InvoiceHub dan klik tautan "Daftar di sini".
help.register.step2.title=Isi informasi Anda
help.register.step2.desc=Berikan nama lengkap, email, nomor telepon, nama perusahaan, dan buat password yang aman.
help.register.step3.title=Upload dokumen yang diperlukan
help.register.step3.desc=Kirim logo perusahaan, dokumen NPWP, dan dokumen pendukung lainnya sesuai kebutuhan.
help.register.step4.title=Tunggu persetujuan
help.register.step4.desc=Tim admin kami akan meninjau pendaftaran Anda dan memverifikasi dokumen Anda. Anda akan menerima konfirmasi email setelah disetujui.
help.register.step5.title=Mulai gunakan portal
help.register.step5.desc=Setelah disetujui, Anda dapat login dan mulai mengirim tagihan dan mengelola tiket Anda.

help.upload.title=Cara Mengunggah Tagihan
help.upload.intro=Setelah pendaftaran Anda disetujui, Anda dapat mengirim tagihan melalui Daftar Tiket Vendor. Setiap pengiriman membuat tiket baru untuk pelacakan.
help.upload.step1.title=Buka Tiket Vendor
help.upload.step1.desc=Dari sidebar, klik "Tiket Vendor" untuk membuka halaman daftar tiket.
help.upload.step2.title=Klik Baru
help.upload.step2.desc=Klik tombol "Baru" di kanan atas Daftar Tiket Vendor untuk membuka formulir pengiriman tagihan.
help.upload.step3.title=Isi detail tagihan
help.upload.step3.desc=Masukkan Nomor Tagihan, Nomor PO, Nominal, Mata Uang, Tanggal Tagihan, Subtotal, dan Pajak. Total akan dihitung secara otomatis.
help.upload.step4.title=Klik Selanjutnya
help.upload.step4.desc=Setelah semua detail tagihan diisi, klik tombol "Selanjutnya" untuk melanjutkan ke langkah upload dokumen.
help.upload.step5.title=Upload dokumen pendukung
help.upload.step5.desc=Lampirkan semua file yang diperlukan termasuk salinan Tagihan, Surat Jalan, salinan Purchase Order (PO), dan dokumen pendukung lainnya yang diminta.
help.upload.step6.title=Kirim tiket Anda
help.upload.step6.desc=Tinjau semua informasi dan file yang diunggah, lalu klik "Kirim" untuk mengirim tagihan Anda untuk ditinjau admin.
help.upload.note=Setelah dikirim, nomor tiket akan diberikan dan status akan diatur ke "Dibuka". Anda dapat melacak perkembangan kapan saja dari halaman Daftar Tiket Vendor.

help.approval.title=Cara Kerja Persetujuan Tagihan
help.approval.intro=Setiap tagihan yang Anda kirim melalui proses peninjauan dan persetujuan. Berikut cara kerjanya:
help.approval.step1.title=Dikirim/Dibuka
help.approval.step1.desc=Tagihan Anda telah dikirim dan menunggu tim admin untuk meninjaunya.
help.approval.step2.title=Sedang Ditinjau
help.approval.step2.desc=Tim admin sedang aktif meninjau dokumen dan detail tagihan Anda.
help.approval.step3.title=Keputusan Dibuat
help.approval.step3.desc=Admin dapat menyetujui, menolak, atau meminta revisi tagihan Anda:
help.approval.approved=Tagihan Anda diterima dan diproses. Anda akan menerima pembayaran sesuai ketentuan.
help.approval.rejected=Tagihan Anda tidak disetujui. Periksa alasan penolakan dan kirim ulang versi yang diperbaiki.
help.approval.revised=Tagihan Anda memerlukan perubahan. Admin akan memberikan umpan balik tentang apa yang perlu diperbaiki.
help.approval.tip=Anda akan menerima notifikasi email setiap kali status tagihan Anda berubah. Anda juga dapat memeriksa status dari halaman "Tagihan Masuk".

help.status.title=Cara Membaca Status Tagihan Anda
help.status.intro=Status tagihan Anda ditampilkan di halaman "Tagihan Masuk". Setiap tagihan menampilkan status saat ini dengan lencana berwarna:
help.status.pending=Tagihan Anda telah dikirim dan menunggu peninjauan.
help.status.approved=Tagihan Anda telah disetujui dan masuk dalam antrian pemrosesan.
help.status.revised=Tagihan Anda memerlukan koreksi. Hubungi admin atau periksa umpan balik.
help.status.released=Tagihan Anda telah diproses dan dirilis untuk pembayaran.
help.status.detail=Klik pada entri tagihan untuk melihat halaman detail tagihan lengkap, yang mencakup riwayat tiket lengkap, perubahan status, dan komentar dari admin.

help.contact.title=Cara Menghubungi Admin
help.contact.intro=Jika Anda memiliki pertanyaan atau membutuhkan dukungan, Anda dapat menghubungi tim admin kami menggunakan salah satu metode berikut:
help.contact.call=Hubungi kami:
help.contact.message=Kirim pesan:
help.contact.message.desc=Gunakan {0} di portal untuk mengirim pertanyaan Anda.
help.contact.form.link=Formulir Kontak
help.contact.response=Tim kami biasanya merespons pengiriman formulir kontak dalam 24-48 jam kerja. Untuk hal mendesak, silakan hubungi hotline.

help.faq.title=Pertanyaan yang Sering Diajukan
help.faq.q1=Berapa lama waktu yang dibutuhkan untuk persetujuan pendaftaran saya?
help.faq.a1=Biasanya, persetujuan pendaftaran vendor membutuhkan 2-5 hari kerja. Kami meninjau dokumen Anda dan memverifikasi informasi bisnis Anda selama waktu ini. Anda akan menerima notifikasi email setelah akun Anda disetujui atau jika informasi tambahan diperlukan.
help.faq.q2=Format file apa saja yang didukung untuk upload dokumen?
help.faq.a2=Kami mendukung sebagian besar format file umum termasuk PDF, JPG, PNG, WEBP, DOC, DOCX, dan XLS. Ukuran file maksimal biasanya 25 MB per file. Pastikan dokumen Anda jelas dan terbaca untuk peninjauan cepat.
help.faq.q3=Bisakah saya mengedit atau menghapus tagihan setelah dikirim?
help.faq.a3=Anda hanya dapat menghapus tagihan dengan status "Menunggu". Setelah tagihan sedang ditinjau (status diubah oleh admin), tagihan tidak dapat dihapus. Jika Anda perlu melakukan perubahan, silakan hubungi tim admin atau kirim ulang dengan koreksi.
help.faq.q4=Apa yang harus saya lakukan jika tagihan saya ditolak?
help.faq.a4=Ketika tagihan ditolak, periksa email notifikasi atau halaman detail tagihan untuk melihat alasan penolakan. Perbaiki masalah yang disebutkan dan kirim ulang tagihan Anda. Jika Anda tidak yakin tentang alasan penolakan, hubungi hotline kami.
help.faq.q5=Bagaimana cara melacak status tagihan saya?
help.faq.a5=Semua tagihan Anda tercantum di halaman "Tagihan Masuk" dengan status saat ini. Anda dapat mengklik tagihan apa pun untuk melihat informasi detail, riwayat status, dan komentar admin. Anda juga akan menerima notifikasi email setiap kali status tagihan berubah.
help.faq.q6=Bagaimana jika saya tidak menerima email notifikasi untuk perubahan status?
help.faq.a6=Periksa folder spam/junk email Anda karena email terkadang terfilter. Pastikan alamat email di profil Anda benar. Jika Anda masih tidak menerima email, Anda dapat memeriksa bagian notifikasi di portal dari ikon lonceng di navigasi atas.
help.faq.q7=Bisakah saya melihat riwayat pembayaran tagihan saya?
help.faq.a7=Informasi pembayaran tagihan biasanya diberikan melalui komunikasi atau laporan terpisah. Untuk riwayat pembayaran detail, silakan hubungi tim admin kami atau hubungi hotline.
help.faq.q8=Apa yang harus saya sertakan saat mengirim tagihan?
help.faq.a8=Anda harus menyertakan: (1) Detail perusahaan Anda, (2) Nomor dan tanggal tagihan, (3) Nominal dalam Rupiah Indonesia (IDR), (4) Informasi klien yang ditagih, (5) PDF tagihan atau salinan pindai, dan (6) Dokumen pendukung seperti bukti pajak atau bukti pengiriman sesuai kebutuhan.
help.faq.q9=Bagaimana cara mengubah password atau memperbarui profil saya?
help.faq.a9=Perubahan password dan pembaruan profil saat ini dikelola melalui tim admin. Silakan hubungi hotline dengan permintaan Anda, dan tim kami akan membantu Anda.
help.faq.q10=Bagaimana jika saya mengalami masalah teknis dengan portal?
help.faq.a10=Coba bersihkan cache dan cookie browser Anda, lalu coba akses portal lagi. Jika masalah berlanjut, coba gunakan browser atau perangkat yang berbeda. Untuk masalah teknis yang belum teratasi, silakan hubungi hotline dukungan kami atau gunakan Formulir Kontak.

