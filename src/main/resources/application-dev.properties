resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL:noreply@invoicehub.cloud}
resend.reply-to=${RESEND_REPLY_TO:automation@flow-force.com}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/invoicehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
app.admin.email=${APP_ADMIN_EMAIL}
app.base-url=${APP_BASE_URL:http://localhost:8080}
logging.level.com.billing.invoicehub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=INFO
server.servlet.session.timeout=30m

# Gemini API config
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

