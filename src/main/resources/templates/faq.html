<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FAQ - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('FAQ')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebarMobile('')"></div>
    <main class="portal-main">
        <div class="card" style="max-width:900px;margin:2rem auto;">
            <div class="card-body">
                <h2>Frequently Asked Questions</h2>
                <div class="mt-4">
                    <h5>How do I submit an invoice?</h5>
                    <p>Go to Vendor Tickets &gt; Create New Ticket and follow the steps.</p>
                </div>
                <div class="mt-3">
                    <h5>What file types are supported?</h5>
                    <p>PDF, PNG, JPG, JPEG, WEBP.</p>
                </div>
                <div class="mt-3">
                    <h5>Who do I contact for help?</h5>
                    <p>Call our helpline: <strong>+1-800-123-4567</strong> or use the <a href="/contact">Contact Form</a>.</p>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
