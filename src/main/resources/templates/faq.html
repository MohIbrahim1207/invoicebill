<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{faq.title}">FAQ - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar(#{faq.heading})"></div>
<div th:replace="fragments/layout :: sidebarMobile('faq')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('faq')"></div>
    <main class="portal-main">
        <h1 class="portal-heading mb-4" th:text="#{faq.heading}">Frequently Asked Questions</h1>
        <div class="card portal-card">
            <div class="card-body">
                <div class="accordion" id="faqAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#q1" th:text="#{faq.q1}">How do I submit an invoice?</button></h2>
                        <div id="q1" class="accordion-collapse collapse show" data-bs-parent="#faqAccordion"><div class="accordion-body" th:text="#{faq.a1}">Go to Vendor Tickets > Create New Ticket and follow the steps.</div></div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q2" th:text="#{faq.q2}">What file types are supported?</button></h2>
                        <div id="q2" class="accordion-collapse collapse" data-bs-parent="#faqAccordion"><div class="accordion-body" th:text="#{faq.a2}">PDF, PNG, JPG, JPEG, WEBP.</div></div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#q3" th:text="#{faq.q3}">Who do I contact for help?</button></h2>
                        <div id="q3" class="accordion-collapse collapse" data-bs-parent="#faqAccordion"><div class="accordion-body" th:utext="#{faq.a3}">Call our helpline: <strong>+91-8972779588</strong> or use the <a href="/contact">Contact Form</a>.</div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
