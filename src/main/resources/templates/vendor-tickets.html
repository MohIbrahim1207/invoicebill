<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{ticket.title}">InvoiceHub - Vendor Ticket List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">
    <div th:replace="fragments/layout :: topbar(#{ticket.heading})"></div>
    <div th:replace="fragments/layout :: sidebarMobile('tickets')"></div>
    <div class="portal-shell">
        <div th:replace="fragments/layout :: sidebar('tickets')"></div>
        <main class="portal-main">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
                <div>
                    <h1 class="portal-heading mb-1" th:text="#{ticket.heading}">Vendor Ticket List</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/dashboard"
                                    th:text="#{ticket.breadcrumb.portal}">Portal</a></li>
                            <li class="breadcrumb-item active" aria-current="page" th:text="#{ticket.breadcrumb.list}">
                                Vendor Ticket List</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a href="/vendor-tickets/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <span
                            th:text="#{common.new}">New</span></a>
                </div>
            </div>

            <div class="card portal-card mb-4">
                <div class="card-body">
                    <form th:action="@{/vendor-tickets}" method="get" class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label" th:text="#{ticket.search.ticketNo}">Ticket No</label>
                            <input type="text" name="ticketNo" class="form-control" th:value="${searchTicketNo}"
                                th:placeholder="#{ticket.search.ticketNo.placeholder}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" th:text="#{ticket.search.invoiceNo}">Invoice No</label>
                            <input type="text" name="invoiceNo" class="form-control" th:value="${searchInvoiceNo}"
                                th:placeholder="#{ticket.search.invoiceNo.placeholder}">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" th:text="#{ticket.search.year}">Year</label>
                            <select name="year" class="form-select">
                                <option value="" th:text="#{common.all}">All</option>
                                <option th:each="y : ${availableYears}" th:value="${y}" th:text="${y}"
                                    th:selected="${y == selectedYear}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" th:text="#{ticket.search.status}">Status</label>
                            <select name="status" class="form-select">
                                <option value="" th:text="#{common.all}">All</option>
                                <option value="OPEN" th:selected="${searchStatus == 'OPEN'}"
                                    th:text="#{ticket.history.status.open}">OPEN</option>
                                <option value="IN_PROGRESS" th:selected="${searchStatus == 'IN_PROGRESS'}"
                                    th:text="#{ticket.history.status.in_progress}">IN_PROGRESS</option>
                                <option value="REVISE" th:selected="${searchStatus == 'REVISE'}"
                                    th:text="#{ticket.history.status.revise}">REVISE</option>
                                <option value="RESOLVED" th:selected="${searchStatus == 'RESOLVED'}"
                                    th:text="#{ticket.history.status.resolved}">RESOLVED</option>
                                <option value="CANCEL" th:selected="${searchStatus == 'CANCEL'}"
                                    th:text="#{ticket.history.status.cancel}">CANCEL</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i> <span
                                    th:text="#{common.search}">Search</span></button>
                        </div>
                    </form>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card portal-card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table align-middle portal-table">
                            <thead>
                                <tr>
                                    <th th:text="#{ticket.table.no}">No</th>
                                    <th th:text="#{ticket.table.ticketNo}">Ticket No</th>
                                    <th th:text="#{ticket.table.invoiceNo}">Invoice No</th>
                                    <th th:text="#{ticket.table.invoiceDate}">Invoice Date</th>
                                    <th th:text="#{ticket.table.amount}">Amount</th>
                                    <th th:text="#{ticket.table.subtotal}">Subtotal</th>
                                    <th th:text="#{ticket.table.tax}">Tax</th>
                                    <th th:text="#{ticket.table.total}">Total</th>
                                    <th th:text="#{ticket.table.currency}">Currency</th>
                                    <th th:text="#{ticket.table.statusRequest}">Status Request</th>
                                    <th th:text="#{ticket.table.history}">History</th>
                                    <th th:text="#{ticket.table.cancelTicket}">Cancel Ticket</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${tickets == null or tickets.empty}" class="table-empty-row">
                                    <td colspan="12">
                                        <div class="empty-state">
                                            <i class="bi bi-inbox"></i>
                                            <p th:text="#{ticket.empty}">No vendor tickets found.</p>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="ticket, iterStat : ${tickets}"
                                    th:with="statusName=${ticket.statusRequest != null ? ticket.statusRequest.name() : null}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${ticket.ticketNo}">-</td>
                                    <td th:text="${ticket.invoiceNo}">-</td>
                                    <td th:text="${ticket.invoiceDate}">-</td>
                                    <td
                                        th:text="${T(com.billing.invoicehub.util.FormatUtils).formatCurrency(ticket.amount, ticket.currency)}">
                                        -</td>
                                    <td
                                        th:text="${T(com.billing.invoicehub.util.FormatUtils).formatCurrency(ticket.subtotal, ticket.currency)}">
                                        -</td>
                                    <td
                                        th:text="${T(com.billing.invoicehub.util.FormatUtils).formatCurrency(ticket.tax, ticket.currency)}">
                                        -</td>
                                    <td
                                        th:text="${T(com.billing.invoicehub.util.FormatUtils).formatCurrency(ticket.total, ticket.currency)}">
                                        -</td>
                                    <td th:text="${ticket.currency}">-</td>
                                    <td>
                                        <span th:if="${statusName == 'OPEN'}" class="badge bg-dark"
                                            th:text="#{ticket.history.status.open}">Open</span>
                                        <span th:if="${statusName == 'IN_PROGRESS'}" class="badge bg-primary"
                                            th:text="#{ticket.history.status.in_progress}">In Progress</span>
                                        <span th:if="${statusName == 'REVISE'}" class="badge bg-danger"
                                            th:text="#{ticket.history.status.revise}">Revise</span>
                                        <span th:if="${statusName == 'RESOLVED'}" class="badge bg-success"
                                            th:text="#{ticket.history.status.resolved}">Resolved</span>
                                        <span th:if="${statusName == 'CANCEL'}" class="badge bg-secondary"
                                            th:text="#{ticket.history.status.cancel}">Cancel</span>
                                        <span th:if="${statusName == null}" class="badge bg-light text-dark">-</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/vendor-tickets/{id}/history(id=${ticket.id})}"
                                            class="btn btn-sm btn-outline-info" th:title="#{ticket.table.history}">
                                            <i class="bi bi-clock-history"></i>
                                        </a>
                                    </td>
                                    <td>
                                        <form th:if="${statusName == 'OPEN'}"
                                            th:action="@{/vendor-tickets/{id}/cancel(id=${ticket.id})}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-sm btn-danger"
                                                th:data-confirm="#{ticket.cancel.confirm}"
                                                onclick="return confirm(this.getAttribute('data-confirm'))"
                                                th:text="#{ticket.cancel.btn}">Cancel</button>
                                        </form>
                                        <span th:if="${statusName != 'OPEN'}" class="text-muted small"
                                            th:text="${statusName == 'CANCEL' ? #messages.msg('ticket.already.cancelled') : '-'}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
