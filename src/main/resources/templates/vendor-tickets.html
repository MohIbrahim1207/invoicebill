<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Vendor Ticket List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Tickets')"></div>
<div th:replace="fragments/layout :: sidebarMobile('tickets')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('tickets')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Vendor Ticket List</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/dashboard">Portal</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Vendor Ticket List</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="card portal-card">
            <div class="card-body">
                <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                <form method="get" action="/vendor-tickets" class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Ticket No</label>
                        <input type="text" name="ticketNo" class="form-control" th:value="${ticketNo}" placeholder="Enter ticket number">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Invoice No</label>
                        <input type="text" name="invoiceNo" class="form-control" th:value="${invoiceNo}" placeholder="Enter invoice number">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Year</label>
                        <select name="year" class="form-select">
                            <option value="">All</option>
                            <option th:each="availableYear : ${availableYears}"
                                    th:value="${availableYear}"
                                    th:text="${availableYear}"
                                    th:selected="${year != null and year == availableYear}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="ALL" th:selected="${status == null or status == 'ALL'}">ALL</option>
                            <option th:each="option : ${statusOptions}"
                                    th:value="${option.name()}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(option.name(), '_', ' ')))}"
                                    th:selected="${status == option.name()}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Search
                        </button>
                        <a href="/vendor-tickets/new" class="btn btn-outline-primary w-100">
                            <i class="bi bi-plus-circle"></i> New
                        </a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table portal-table align-middle">
                        <thead>
                        <tr>
                            <th>No</th>
                            <th>Ticket No</th>
                            <th>Invoice No</th>
                            <th>Invoice Date</th>
                            <th>Amount</th>
                            <th>Subtotal</th>
                            <th>Tax</th>
                            <th>Total</th>
                            <th>Currency</th>
                            <th>Status Request</th>
                            <th>History</th>
                            <th>Cancel Ticket</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${tickets == null or #lists.isEmpty(tickets)}" class="table-empty-row">
                            <td colspan="12">
                                <div class="empty-state">
                                    <i class="bi bi-ticket-perforated"></i>
                                    <p>No vendor tickets found.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${tickets != null and !#lists.isEmpty(tickets)}" th:each="ticket, row : ${tickets}" th:with="statusName=${ticket.statusRequest != null ? ticket.statusRequest.name() : null}">
                            <td th:text="${row.index + 1}"></td>
                            <td th:text="${ticket.ticketNo}"></td>
                            <td th:text="${ticket.invoiceNo}"></td>
                            <td th:text="${ticket.invoiceDate}"></td>
                            <td th:text="${#numbers.formatDecimal(ticket.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(ticket.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(ticket.tax, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${#numbers.formatDecimal(ticket.total, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${ticket.currency}"></td>
                            <td>
                                <span th:if="${statusName == 'CONFIRM'}"
                                      class="fw-semibold text-primary">Confirm</span>
                                <span th:if="${statusName == 'CANCEL'}"
                                      class="fw-semibold text-secondary">Cancel</span>
                                <span th:if="${statusName != null and statusName != 'CONFIRM' and statusName != 'CANCEL'}"
                                      class="fw-semibold text-dark"
                                      th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(statusName, '_', ' ')))}"></span>
                                <span th:if="${statusName == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/vendor-tickets/{id}/history(id=${ticket.id})}" class="btn btn-sm btn-outline-primary">View</a>
                            </td>
                            <td>
                                <form th:if="${statusName != 'CANCEL'}"
                                      th:action="@{/vendor-tickets/{id}/cancel(id=${ticket.id})}"
                                      method="post"
                                      class="d-inline">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Cancel this ticket?');">
                                        Cancel Ticket
                                    </button>
                                </form>
                                <button th:if="${statusName == 'CANCEL'}"
                                        type="button"
                                        class="btn btn-sm btn-outline-secondary"
                                        disabled>
                                    Already Cancelled
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
