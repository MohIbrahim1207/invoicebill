<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Rejected</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f4f7fb; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background-color: white; padding: 20px; border: 1px solid #ddd; border-top: 0; }
        .footer { background-color: #f5f5f5; padding: 10px; text-align: center; font-size: 12px; color: #666; border-radius: 0 0 8px 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>Registration Rejected</h2></div>
    <div class="content">
        <p>Dear <strong th:text="${vendorName}">Vendor</strong>,</p>
        <p>We could not approve your vendor registration at this time.</p>
        <p><strong>Reason:</strong></p>
        <p th:text="${reason}">Reason</p>
        <p>Best regards,<br>InvoiceHub Team</p>
    </div>
    <div class="footer"><p>&copy; 2026 InvoiceHub. All rights reserved.</p></div>
</div>
</body>
</html>
