<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Rejected</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f4f7fb; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #dc3545; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background-color: white; padding: 20px; border: 1px solid #ddd; border-top: 0; }
        .footer { background-color: #f5f5f5; padding: 10px; text-align: center; font-size: 12px; color: #666; border-radius: 0 0 8px 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Invoice Rejected</h2>
    </div>
    <div class="content">
        <p>Dear <strong th:text="${vendorName}">Vendor</strong>,</p>
        <p>Unfortunately, your invoice has been rejected.</p>
        <p><strong>Invoice Number:</strong> <span th:text="${invoiceNumber}">INV-001</span></p>
        <p><strong>Amount:</strong> <span th:text="${amount}">Rp 0</span></p>
        <p><strong>Rejection Date:</strong> <span th:text="${date}">Jan 01, 2026</span></p>
        <p><strong>Reason for Rejection:</strong></p>
        <p th:text="${reason}">Reason</p>
        <div style="text-align: center; margin: 24px 0;">
            <a th:href="${loginUrl != null ? loginUrl : 'https://invoicehub.cloud/login'}"
               style="display: inline-block; background-color: #2563eb; color: #ffffff !important; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 14px;">
                Login to InvoiceHub / Masuk ke InvoiceHub &rarr;
            </a>
        </div>
        <p>Best regards,<br>InvoiceHub Team</p>
    </div>
    <div class="footer">
        <p>&copy; 2026 InvoiceHub. All rights reserved.</p>
    </div>
</div>
</body>
</html>
