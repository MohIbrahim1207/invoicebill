<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset OTP</title>
    <style>
        body { margin: 0; padding: 0; background: #f4f7fb; font-family: Arial, sans-serif; color: #1f2937; }
        .container { max-width: 640px; margin: 0 auto; padding: 24px; }
        .card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
        .header { background: linear-gradient(135deg,#1e3a8a,#2563eb); color: #fff; padding: 28px 32px; }
        .body { padding: 32px; line-height: 1.7; }
        .otp { display: inline-block; padding: 12px 18px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; font-size: 24px; letter-spacing: 4px; font-weight: 700; }
        .footer { padding: 0 32px 28px; color: #6b7280; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1 style="margin:0;">InvoiceHub</h1>
            <p style="margin:8px 0 0;opacity:.9;">Password reset verification code</p>
        </div>
        <div class="body">
            <p>Hello,</p>
            <p>Your OTP for password reset is:</p>
            <div class="otp" th:text="${otp}">123456</div>
            <p style="margin-top:20px;">This OTP is valid for 10 minutes.</p>
            <p>If you did not request this, please ignore this email.</p>
        </div>
        <div class="footer">
            This is an automated notification from InvoiceHub. Please do not reply to this email.
        </div>
    </div>
</div>
</body>
</html>
