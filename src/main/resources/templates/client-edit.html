<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Vendor - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Edit Vendor')"></div>
<div th:replace="fragments/layout :: sidebarMobile('clients')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('clients')"></div>
    <main class="portal-main">
        <div class="d-flex justify-content-between mb-3 gap-2">
            <h1 class="portal-heading mb-1">Edit Vendor</h1>
            <a href="/clients" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
        <section class="card portal-card mb-4">
            <div class="card-body">
                <form th:action="@{/updateClient}" method="post" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${client.id}">
                    <div class="col-md-6">
                        <label class="form-label">Vendor Name <span class="text-danger">*</span></label>
                        <input type="text" name="companyName" th:value="${client.companyName}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">GST Number</label>
                        <input type="text" name="gstNumber" th:value="${client.gstNumber}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" th:value="${client.email}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="tel" name="phone" th:value="${client.phone}" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="3" th:text="${client.address}"></textarea>
                    </div>
                    <div class="col-12">
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/clients" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
