<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{ticket.new.title}">InvoiceHub - New Vendor Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
    <style>
        .progress-dots{display:flex;justify-content:center;gap:1rem;margin-bottom:2rem}
        .progress-dot{width:40px;height:40px;border-radius:50%;background:#e3e8ef;border:2px solid #e3e8ef;display:flex;align-items:center;justify-content:center;font-weight:600;color:#6b7a8c}
        .progress-dot.active,.progress-dot.completed{background:#2b6ef2;border-color:#2b6ef2;color:#fff}
        .success-card{text-align:center;padding:2rem 1.5rem}
        .success-icon{width:80px;height:80px;border-radius:50%;background:#e7f8ee;color:#1f9d55;display:inline-flex;align-items:center;justify-content:center;font-size:2.5rem;margin-bottom:1rem}
        .ticket-no{font-size:1.5rem;font-weight:700;color:#1f2d3d;letter-spacing:.03em}
        .action-row{display:flex;gap:.8rem;margin-top:1.5rem;flex-wrap:wrap}
        .action-row .btn{flex:1;min-width:220px}
        @media (max-width:768px){.progress-dots{gap:.5rem}.progress-dot{width:32px;height:32px;font-size:.8rem}}
    </style>
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Tickets')"></div>
<div th:replace="fragments/layout :: sidebarMobile('tickets')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('tickets')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-2">
            <div>
                <h1 class="portal-heading mb-1" th:text="#{ticket.new.heading}">New Vendor Ticket</h1>
                <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="/dashboard" th:text="#{ticket.new.breadcrumb.portal}">Portal</a></li><li class="breadcrumb-item"><a href="/vendor-tickets" th:text="#{ticket.new.breadcrumb.tickets}">Vendor Tickets</a></li><li class="breadcrumb-item active" aria-current="page" th:text="#{ticket.new.step5.breadcrumb}">Success</li></ol></nav>
            </div>
        </div>

        <div class="progress-dots">
            <div class="progress-dot completed">1</div>
            <div class="progress-dot completed">2</div>
            <div class="progress-dot completed">3</div>
            <div class="progress-dot completed">4</div>
            <div class="progress-dot active">5</div>
        </div>

        <div class="card portal-card">
            <div class="card-body success-card">
                <div class="success-icon"><i class="bi bi-check-lg"></i></div>
                <h2 class="section-title mb-2" th:text="#{ticket.new.step5.success.heading}">Ticket submitted successfully!</h2>
                <p class="text-muted mb-3" th:text="#{ticket.new.step5.success.subtitle}">Your vendor ticket has been created and is now in the system.</p>
                <div class="ticket-no" th:text="${ticketNo != null ? ticketNo : '-'}">2026-00001</div>
                <div class="text-muted mt-1" th:text="#{ticket.new.step5.generated.ticketNo}">Generated Ticket No</div>

                <div class="action-row">
                    <a href="/vendor-tickets" class="btn btn-primary"><i class="bi bi-list-ul"></i> <span th:text="#{ticket.new.step5.view.tickets}">View My Tickets</span></a>
                    <a href="/vendor-tickets/new" class="btn btn-outline-primary"><i class="bi bi-plus-circle"></i> <span th:text="#{ticket.new.step5.create.new}">Create New Ticket</span></a>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
