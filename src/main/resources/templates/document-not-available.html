<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document Not Available - InvoiceHub</title>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.6.3">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.6.3">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.6.3">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.6.3">
    <link rel="manifest" href="/site.webmanifest?v=1.6.3">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card portal-card shadow-sm text-center p-4" style="max-width: 520px; width: 100%;">
        <div class="card-body">
            <div class="mb-3">
                <i class="bi bi-file-earmark-x text-warning" style="font-size: 3.5rem;"></i>
            </div>
            <h1 class="portal-heading fs-4 mb-2">Document Not Available</h1>
            <h2 class="text-secondary fs-6 fw-normal mb-3">Dokumen Tidak Tersedia</h2>

            <p class="text-secondary small mb-1">
                The requested document is not available or has not been uploaded yet.
            </p>
            <p class="text-muted small mb-4 fst-italic">
                Dokumen yang diminta tidak tersedia atau belum diunggah.
            </p>

            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-primary btn-sm px-3">
                    <i class="bi bi-house-door me-1"></i> <span>Home / Beranda</span>
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm px-3">
                    <i class="bi bi-arrow-left me-1"></i> <span>Back / Kembali</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
