<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Create Purchase Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('New Purchase Order')"></div>
<div th:replace="fragments/layout :: sidebarMobile('purchase-orders')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('purchase-orders')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Create Purchase Order</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Admin</a></li>
                        <li class="breadcrumb-item"><a href="/admin/purchase-orders">Purchase Orders</a></li>
                        <li class="breadcrumb-item active">Create</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card portal-card">
            <div class="card-body">
                <form th:action="@{/admin/purchase-orders}" method="post" th:object="${purchaseOrderRequest}">
                    <div class="mb-3">
                        <label for="poNumber" class="form-label">PO Number</label>
                        <input type="text" id="poNumber" th:field="*{poNumber}" class="form-control form-control-lg"
                               placeholder="e.g., PO-2026-001" required maxlength="50">
                        <div class="form-text">Unique purchase order number</div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('poNumber')}" th:errors="*{poNumber}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="vendorId" class="form-label">Vendor</label>
                        <select id="vendorId" th:field="*{vendorId}" class="form-select form-select-lg" required>
                            <option value="">-- Select Vendor --</option>
                            <option th:each="vendor : ${vendors}" th:value="${vendor.id}" th:text="${vendor.username}"></option>
                        </select>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('vendorId')}" th:errors="*{vendorId}"></div>
                    </div>



                    <div class="mb-4">
                        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-2">
                            <div>
                                <label class="form-label mb-1">Items</label>
                                <div class="form-text">Add one or more purchase order line items. Total is calculated automatically.</div>
                            </div>
                            <button type="button" class="btn btn-outline-primary" id="addItemBtn">
                                <i class="bi bi-plus-circle"></i> Add Item
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table portal-table align-middle" id="itemsTable">
                                <thead>
                                    <tr>
                                        <th style="min-width: 220px;">Item Name</th>
                                        <th style="min-width: 130px;">Quantity</th>
                                        <th style="min-width: 150px;">Unit Price</th>
                                        <th style="min-width: 150px;">Line Total</th>
                                        <th class="text-end" style="width: 80px;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item, itemStat : *{items}">
                                        <td>
                                            <input type="text" class="form-control item-name" th:field="*{items[__${itemStat.index}__].itemName}" required maxlength="255" placeholder="e.g., Control valve">
                                        </td>
                                        <td>
                                            <input type="number" class="form-control item-quantity" th:field="*{items[__${itemStat.index}__].quantity}" required min="0.01" step="0.01">
                                        </td>
                                        <td>
                                            <input type="number" class="form-control item-unit-price" th:field="*{items[__${itemStat.index}__].unitPrice}" required min="0.01" step="0.01">
                                        </td>
                                        <td>
                                            <input type="number" class="form-control item-line-total" th:field="*{items[__${itemStat.index}__].lineTotal}" readonly tabindex="-1">
                                        </td>
                                        <td class="text-end">
                                            <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" title="Remove item">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr>
                                        <th colspan="3" class="text-end">Purchase Order Total</th>
                                        <th>
                                            <input type="number" id="poTotalDisplay" class="form-control fw-bold" readonly tabindex="-1">
                                        </th>
                                        <th></th>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        <input type="hidden" id="poAmount" th:field="*{poAmount}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('items')}" th:errors="*{items}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="dueDate" class="form-label">Due Date</label>
                        <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control form-control-lg" required th:attr="min=${minDueDate}">
                        <div class="form-text">Payment due date for this purchase order</div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                                  placeholder="Add any details about this purchase order..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="/admin/purchase-orders" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Purchase Order</button>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                </form>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tableBody = document.querySelector('#itemsTable tbody');
        const addItemBtn = document.getElementById('addItemBtn');
        const poTotalDisplay = document.getElementById('poTotalDisplay');
        const poAmountInput = document.getElementById('poAmount');

        function toNumber(value) {
            const parsed = parseFloat(value);
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function formatAmount(value) {
            return value.toFixed(2);
        }

        function calculateTotals() {
            let total = 0;
            tableBody.querySelectorAll('tr').forEach(function (row) {
                const quantity = toNumber(row.querySelector('.item-quantity').value);
                const unitPrice = toNumber(row.querySelector('.item-unit-price').value);
                const lineTotal = quantity * unitPrice;
                row.querySelector('.item-line-total').value = formatAmount(lineTotal);
                total += lineTotal;
            });
            poTotalDisplay.value = formatAmount(total);
            poAmountInput.value = formatAmount(total);
            updateRemoveButtons();
        }

        function reindexRows() {
            tableBody.querySelectorAll('tr').forEach(function (row, index) {
                row.querySelector('.item-name').setAttribute('name', `items[${index}].itemName`);
                row.querySelector('.item-name').setAttribute('id', `items${index}.itemName`);
                row.querySelector('.item-quantity').setAttribute('name', `items[${index}].quantity`);
                row.querySelector('.item-quantity').setAttribute('id', `items${index}.quantity`);
                row.querySelector('.item-unit-price').setAttribute('name', `items[${index}].unitPrice`);
                row.querySelector('.item-unit-price').setAttribute('id', `items${index}.unitPrice`);
                row.querySelector('.item-line-total').setAttribute('name', `items[${index}].lineTotal`);
                row.querySelector('.item-line-total').setAttribute('id', `items${index}.lineTotal`);
            });
        }

        function updateRemoveButtons() {
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach(function (row) {
                row.querySelector('.remove-item-btn').disabled = rows.length === 1;
            });
        }

        function createRow() {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="form-control item-name" required maxlength="255" placeholder="e.g., Control valve"></td>
                <td><input type="number" class="form-control item-quantity" required min="0.01" step="0.01"></td>
                <td><input type="number" class="form-control item-unit-price" required min="0.01" step="0.01"></td>
                <td><input type="number" class="form-control item-line-total" readonly tabindex="-1"></td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-danger remove-item-btn" title="Remove item">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
            reindexRows();
            calculateTotals();
        }

        tableBody.addEventListener('input', function (event) {
            if (event.target.classList.contains('item-quantity') || event.target.classList.contains('item-unit-price')) {
                calculateTotals();
            }
        });

        tableBody.addEventListener('click', function (event) {
            const removeButton = event.target.closest('.remove-item-btn');
            if (!removeButton || removeButton.disabled) {
                return;
            }
            removeButton.closest('tr').remove();
            reindexRows();
            calculateTotals();
        });

        addItemBtn.addEventListener('click', createRow);
        reindexRows();
        calculateTotals();
    });
</script>
</body>
</html>
