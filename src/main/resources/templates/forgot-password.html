<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg auth-bg">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card portal-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3"><i class="bi bi-lock-fill"></i></div>
                        <h1 class="h3 fw-bold mb-2">Forgot Password?</h1>
                        <p class="text-muted mb-0">Enter your username and the email associated with your account to receive an OTP</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                    <form th:action="@{/forgot-password}" method="post" class="vstack gap-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required>
                        </div>
                        <div>
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email address" required>
                            <small class="text-muted">If an account exists with these details, you will receive a reset code.</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"
                                onclick="this.disabled=true; this.innerHTML='<i class=\'bi bi-hourglass-split\'></i> Sending...'; this.form.submit();">
                            <i class="bi bi-envelope"></i> Send OTP
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">Remember your password? <a th:href="@{/login}">Back to login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
