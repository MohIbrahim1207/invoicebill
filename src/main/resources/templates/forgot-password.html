<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{forgot.title}">InvoiceHub - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg auth-bg">
    <!-- Language Switcher container -->
    <div class="position-absolute top-0 end-0 p-3 z-3">
        <div class="dropdown shadow-sm" th:with="currentLang=${#locale.language}">
            <button class="btn btn-light btn-sm dropdown-toggle d-inline-flex align-items-center gap-1"
                    type="button"
                    id="languageSelector"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    th:title="#{nav.language}"
                    th:aria-label="#{nav.language}">
                <i class="bi bi-globe2" aria-hidden="true"></i>
                <span th:text="${currentLang == 'id' ? 'Bahasa Indonesia' : 'English'}">English</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="languageSelector">
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2"
                       href="#"
                       th:classappend="${currentLang != 'id'} ? ' active' : ''"
                       data-lang="en"
                       onclick="changeLanguage('en'); return false;">
                        <i class="bi bi-check-lg text-primary" th:classappend="${currentLang == 'id'} ? ' invisible' : ''"></i>
                        <span>English</span>
                        <span class="text-muted small">(en)</span>
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2"
                       href="#"
                       th:classappend="${currentLang == 'id'} ? ' active' : ''"
                       data-lang="id"
                       onclick="changeLanguage('id'); return false;">
                        <i class="bi bi-check-lg text-primary" th:classappend="${currentLang != 'id'} ? ' invisible' : ''"></i>
                        <span>Bahasa Indonesia</span>
                        <span class="text-muted small">(id)</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card portal-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3"><i class="bi bi-lock-fill"></i></div>
                        <h1 class="h3 fw-bold mb-2" th:text="#{forgot.heading}">Forgot Password?</h1>
                        <p class="text-muted mb-0" th:text="#{forgot.subtitle}">Enter your username and the email associated with your account to receive an OTP</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                    <form th:action="@{/forgot-password}" method="post" class="vstack gap-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label" th:text="#{forgot.username}">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" th:placeholder="#{forgot.username.placeholder}" required>
                        </div>
                        <div>
                            <label class="form-label" th:text="#{forgot.email}">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg" th:placeholder="#{forgot.email.placeholder}" required>
                            <small class="text-muted" th:text="#{forgot.email.hint}">If an account exists with these details, you will receive a reset code.</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"
                                th:data-sending="#{forgot.sending}"
                                onclick="this.disabled=true; this.innerHTML='<i class=\'bi bi-hourglass-split\'></i> ' + this.getAttribute('data-sending'); this.form.submit();">
                            <i class="bi bi-envelope"></i> <span th:text="#{forgot.send.otp}">Send OTP</span>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted"><span th:text="#{forgot.remember}">Remember your password?</span> <a th:href="@{/login}" th:text="#{forgot.back.login}">Back to login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function changeLanguage(lang) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.assign(url.toString());
    }
</script>
</body>
</html>
