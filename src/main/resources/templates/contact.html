<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{contact.title}">Contact Us - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar(#{contact.heading})"></div>
<div th:replace="fragments/layout :: sidebarMobile('contact')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('contact')"></div>
    <main class="portal-main">
        <h1 class="portal-heading mb-4" th:text="#{contact.heading}">Contact Us</h1>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card portal-card h-100">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-telephone text-primary" style="font-size: 3rem;"></i>
                        <h4 class="mt-3 mb-2" th:text="#{contact.helpline}">If you need help, call our helpline:</h4>
                        <h2 class="text-primary fw-bold">+1-800-123-4567</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card portal-card h-100">
                    <div class="card-body p-4">
                        <form th:action="@{/contact}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label class="form-label" th:text="#{contact.name}">Your name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:text="#{contact.email}">Your email</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:text="#{contact.subject}">Subject</label>
                                <input type="text" class="form-control" name="subject" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:text="#{contact.message}">Message</label>
                                <textarea class="form-control" rows="4" name="message" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send"></i> <span th:text="#{contact.send}">Send Message</span></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
