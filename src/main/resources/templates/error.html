<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Error</title>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.5.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.5.0">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.5.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.5.0">
    <link rel="manifest" href="/site.webmanifest?v=1.5.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="card portal-card shadow-sm text-center p-4" style="max-width: 480px; width: 100%;">
        <div class="card-body">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
            </div>
            <h1 class="portal-heading fs-3 mb-2" th:text="${status != null ? status + ' - ' + error : 'Something Went Wrong'}">Error</h1>
            <p class="text-muted small mb-4" th:text="${message != null and !message.isBlank() ? message : 'An unexpected error occurred. Please return to the homepage or contact support if the issue persists.'}">
                An unexpected error occurred.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-primary btn-sm px-3">
                    <i class="bi bi-house-door me-1"></i> <span th:text="#{nav.dashboard}">Home</span>
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm px-3">
                    <i class="bi bi-arrow-left me-1"></i> <span th:text="#{action.back}">Go Back</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
