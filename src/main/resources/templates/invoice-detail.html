<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{invoice.detail.title}">Invoice Detail - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">

    <div th:replace="fragments/layout :: topbar(#{invoice.detail.heading})"></div>
    <div th:replace="fragments/layout :: sidebarMobile('billing')"></div>

    <div class="portal-shell">
        <div th:replace="fragments/layout :: sidebar('billing')"></div>

        <main class="portal-main">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
                <div>
                    <h1 class="portal-heading mb-1" th:text="#{invoice.detail.heading}">Invoice Details</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/invoice"
                                    th:text="#{invoice.detail.breadcrumb.billing}">Billing</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Invoice [[${invoice.id}]]</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/invoice/{id}/edit(id=${invoice.id})}" class="btn btn-warning">
                        <i class="bi bi-pencil"></i> <span th:text="#{invoice.detail.edit}">Edit</span>
                    </a>
                    <a href="/invoice" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> <span th:text="#{common.back}">Back</span>
                    </a>
                </div>
            </div>

            <section class="card portal-card">
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <h5 class="text-muted mb-3" th:text="#{invoice.detail.section.invoice}">Invoice Information
                            </h5>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.invoice.number}">Invoice
                                    Number</label>
                                <p class="h5" th:text="${invoice.invoiceNumber}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.invoice.date}">Invoice
                                    Date</label>
                                <p class="h5" th:text="${invoice.invoiceDate}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.amount}">Amount</label>
                                <p class="h5" th:text="${T(com.billing.invoicehub.util.FormatUtils).formatCurrency(invoice.amount, invoice.currency)}"></p>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <h5 class="text-muted mb-3" th:text="#{invoice.detail.section.client}">Client Information
                            </h5>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.company.name}">Company
                                    Name</label>
                                <p class="h5" th:text="${invoice.client != null ? invoice.client.companyName : '-'}">
                                </p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.email}">Email</label>
                                <p th:text="${invoice.client != null ? (invoice.client.email ?: 'N/A') : 'N/A'}"></p>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted" th:text="#{invoice.detail.phone}">Phone</label>
                                <p th:text="${invoice.client != null ? (invoice.client.phone ?: 'N/A') : 'N/A'}"></p>
                            </div>
                        </div>

                        <div class="col-12">
                            <h5 class="text-muted mb-3" th:text="#{invoice.detail.section.file}">File Information</h5>
                            <div
                                class="alert alert-info d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
                                <div>
                                    <i class="bi bi-file-earmark-text"></i>
                                    <strong th:text="#{invoice.detail.file.name}">File Name:</strong>
                                    <span
                                        th:text="${invoice.fileName != null ? invoice.fileName : 'Unknown file'}"></span>
                                </div>
                                <div th:if="${invoice.fileUrl != null and !invoice.fileUrl.isBlank()}"
                                    class="d-flex gap-2 flex-wrap">
                                    <a class="btn btn-primary btn-sm" th:href="${invoice.fileUrl}" target="_blank"
                                        rel="noopener">
                                        <i class="bi bi-eye"></i> <span th:text="#{invoice.detail.view.file}">View
                                            File</span>
                                    </a>
                                    <a class="btn btn-outline-primary btn-sm" th:href="${invoice.fileUrl}"
                                        target="_blank" rel="noopener" download>
                                        <i class="bi bi-download"></i> <span
                                            th:text="#{invoice.detail.download}">Download</span>
                                    </a>
                                </div>
                                <div th:if="${invoice.fileUrl == null or invoice.fileUrl.isBlank()}"
                                    class="text-muted small" th:text="#{invoice.detail.file.not.available}">
                                    File URL is not available yet.
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <hr>
                            <div class="d-flex gap-2">
                                <a th:href="@{/invoice/{id}/edit(id=${invoice.id})}" class="btn btn-warning">
                                    <i class="bi bi-pencil"></i> <span th:text="#{invoice.detail.edit.invoice}">Edit
                                        Invoice</span>
                                </a>
                                <form th:action="@{/deleteInvoice/{id}(id=${invoice.id})}" method="post"
                                    style="display: inline;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-danger"
                                        th:data-confirm="#{invoice.detail.confirm.delete}"
                                        onclick="return confirm(this.getAttribute('data-confirm'));">
                                        <i class="bi bi-trash"></i> <span th:text="#{invoice.detail.delete}">Delete
                                            Invoice</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
