<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice Detail - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">

<div th:replace="fragments/layout :: topbar('Invoice Detail')"></div>
<div th:replace="fragments/layout :: sidebarMobile('billing')"></div>

<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('billing')"></div>

    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Invoice Details</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/invoice">Billing</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Invoice [[${invoice.id}]]</li>
                    </ol>
                </nav>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/invoice/{id}/edit(id=${invoice.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a href="/invoice" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <section class="card portal-card">
            <div class="card-body">
                <div class="row g-4">
                    <div class="col-md-6">
                        <h5 class="text-muted mb-3">Invoice Information</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted">Invoice Number</label>
                            <p class="h5" th:text="${invoice.invoiceNumber}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Invoice Date</label>
                            <p class="h5" th:text="${invoice.invoiceDate}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Amount</label>
                            <p class="h5">₹ <span th:text="${#numbers.formatDecimal(invoice.amount, 1, 'COMMA', 2, 'POINT')}"></span></p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h5 class="text-muted mb-3">Client Information</h5>
                        <div class="mb-3">
                            <label class="form-label text-muted">Company Name</label>
                            <p class="h5" th:text="${invoice.client != null ? invoice.client.companyName : '-'}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Email</label>
                            <p th:text="${invoice.client != null ? (invoice.client.email ?: 'N/A') : 'N/A'}"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Phone</label>
                            <p th:text="${invoice.client != null ? (invoice.client.phone ?: 'N/A') : 'N/A'}"></p>
                        </div>
                    </div>

                    <div class="col-12">
                        <h5 class="text-muted mb-3">File Information</h5>
                        <div class="alert alert-info">
                            <i class="bi bi-file-pdf"></i>
                            <strong>File Name:</strong>
                            <span th:text="${invoice.fileName}"></span>
                        </div>
                        <a th:href="@{/uploads/invoices/{fileName}(fileName=${invoice.fileName})}" class="btn btn-info" target="_blank">
                            <i class="bi bi-download"></i> Download Invoice
                        </a>
                    </div>

                    <div class="col-12">
                        <hr>
                        <div class="d-flex gap-2">
                            <a th:href="@{/invoice/{id}/edit(id=${invoice.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i> Edit Invoice
                            </a>
                            <form th:action="@{/deleteInvoice/{id}(id=${invoice.id})}" method="post" style="display: inline;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this invoice?');">
                                    <i class="bi bi-trash"></i> Delete Invoice
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
