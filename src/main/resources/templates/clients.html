<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Vendor Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">

    <div th:replace="fragments/layout :: topbar('Vendors')"></div>
    <div th:replace="fragments/layout :: sidebarMobile('clients')"></div>

    <div class="portal-shell">
        <div th:replace="fragments/layout :: sidebar('clients')"></div>

        <main class="portal-main">

            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
                <div>
                    <h1 class="portal-heading mb-1">Vendor Management</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/invoice">Portal</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Vendor Management</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a href="/invoice" class="btn btn-light border"><i class="bi bi-receipt-cutoff"></i> Billing
                        Intake</a>
                    <a href="/clients" class="btn btn-outline-secondary"><i class="bi bi-arrow-repeat"></i> Refresh</a>
                </div>
            </div>

            <section class="card portal-card mb-4">
                <div class="card-body">
                    <h2 class="section-title mb-3">Add or Update Vendor</h2>
                    <form th:action="@{/saveClient}" method="post" class="row g-3" id="clientForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="col-md-6">

                            <label class="form-label">
                                Vendor Name
                            </label>

                            <input type="text" name="companyName" class="form-control" placeholder="Enter vendor name"
                                required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                GST Number
                            </label>

                            <input type="text" name="gstNumber" class="form-control" placeholder="Enter GST number">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email" name="email" class="form-control" placeholder="finance@vendor.com">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text" name="phone" class="form-control" placeholder="Enter phone number">

                        </div>

                        <div class="col-12">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea name="address" class="form-control" rows="3"
                                placeholder="Enter vendor address"></textarea>

                        </div>

                        <div class="col-md-7">

                        </div>

                        <div class="col-12 sticky-actions">

                            <button type="reset" class="btn btn-light border">
                                <i class="bi bi-x-circle"></i> Cancel
                            </button>

                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle"></i> Save Vendor
                            </button>

                        </div>

                    </form>
                </div>
            </section>

            <section class="card portal-card">
                <div class="card-body">
                    <div
                        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                        <h2 class="section-title mb-0">Vendor List</h2>
                        <input id="clientSearchInput" type="search" class="form-control form-control-sm client-search"
                            placeholder="Search vendor, GST, email...">
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle portal-table" id="clientTable">

                            <thead>

                                <tr>

                                    <th>ID</th>
                                    <th>Vendor</th>
                                    <th>GST</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Address</th>
                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:if="${#lists.isEmpty(clients)}" class="table-empty-row">
                                    <td colspan="7">
                                        <div class="empty-state">
                                            <i class="bi bi-building"></i>
                                            <p>No vendors added yet.</p>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="client : ${clients}"
                                    th:attr="data-search=${(client.companyName ?: '') + ' ' + (client.gstNumber ?: '') + ' ' + (client.email ?: '')}">
                                    <td th:text="${client.id}"></td>
                                    <td th:text="${client.companyName}"></td>
                                    <td th:text="${client.gstNumber}"></td>
                                    <td th:text="${client.email}"></td>
                                    <td th:text="${client.phone}"></td>
                                    <td th:text="${client.address}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/clients/{id}(id=${client.id})}" class="btn btn-sm btn-info"
                                                title="View"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/clients/{id}/edit(id=${client.id})}"
                                                class="btn btn-sm btn-warning" title="Edit"><i
                                                    class="bi bi-pencil"></i></a>
                                            <form th:action="@{/deleteClient/{id}(id=${client.id})}" method="post"
                                                style="display: inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                                <button type="submit" class="btn btn-sm btn-danger" title="Delete"
                                                    onclick="return confirm('Delete this vendor?');"><i
                                                        class="bi bi-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>

                            </tbody>

                        </table>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
        <div id="portalToast" class="toast align-items-center text-bg-primary border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="portalToastText">Done</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>

    <div id="flashSuccess" th:if="${message}" th:text="${message}" class="d-none"></div>
    <div id="flashError" th:if="${error}" th:text="${error}" class="d-none"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/portal.js}"></script>
</body>

</html>
