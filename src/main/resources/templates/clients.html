<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.5.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=1.5.0">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=1.5.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1.5.0">
    <link rel="manifest" href="/site.webmanifest?v=1.5.0">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{sidebar.clients} + ' - InvoiceHub'">InvoiceHub - Vendor Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">
    <div th:replace="~{fragments/layout :: topbar(#{sidebar.clients})}"></div>
    <div th:replace="~{fragments/layout :: sidebarMobile('clients')}"></div>

    <div class="portal-shell">
        <div th:replace="~{fragments/layout :: sidebar('clients')}"></div>

        <main class="portal-main">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
                <div>
                    <h1 class="portal-heading mb-1" th:text="#{sidebar.clients}">Vendor Management</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/invoice">Portal</a></li>
                            <li class="breadcrumb-item active" aria-current="page" th:text="#{sidebar.clients}">Vendor Management</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a href="/invoice" class="btn btn-light border"><i class="bi bi-receipt-cutoff me-1"></i> <span th:text="#{sidebar.billing}">Billing Intake</span></a>
                    <a href="/clients" class="btn btn-outline-secondary"><i class="bi bi-arrow-repeat me-1"></i> <span th:text="#{admin.tickets.filter.reset}">Refresh</span></a>
                </div>
            </div>

            <section class="card portal-card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="section-title mb-3" th:text="#{admin.clients.add_vendor}">Add or Update Vendor</h2>
                    <form th:action="@{/saveClient}" method="post" class="row g-3" id="clientForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted" th:text="#{admin.clients.table.company}">Vendor Name</label>
                            <input type="text" name="companyName" class="form-control" placeholder="Enter vendor name" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted" th:text="#{admin.vendors.table.gst}">GST Number</label>
                            <input type="text" name="gstNumber" class="form-control" placeholder="Enter GST / NPWP number">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted" th:text="#{admin.clients.table.email}">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="finance@vendor.com">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-muted" th:text="#{admin.clients.table.phone}">Phone</label>
                            <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold text-muted">Address</label>
                            <textarea name="address" class="form-control" rows="3" placeholder="Enter vendor address"></textarea>
                        </div>

                        <div class="col-12 sticky-actions">
                            <button type="reset" class="btn btn-light border">
                                <i class="bi bi-x-circle me-1"></i> Cancel
                            </button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle me-1"></i> <span th:text="#{admin.tickets.manage.save}">Save Vendor</span>
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card portal-card shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                        <h2 class="section-title mb-0" th:text="#{sidebar.clients}">Vendor List</h2>
                        <input id="clientSearchInput" type="search" class="form-control form-control-sm client-search"
                            th:placeholder="#{admin.vendors.search.placeholder}">
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle portal-table" id="clientTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th th:text="#{admin.clients.table.company}">Vendor</th>
                                    <th th:text="#{admin.vendors.table.gst}">GST</th>
                                    <th th:text="#{admin.clients.table.email}">Email</th>
                                    <th th:text="#{admin.clients.table.phone}">Phone</th>
                                    <th>Address</th>
                                    <th th:text="#{admin.clients.table.action}">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(clients)}" class="table-empty-row">
                                    <td colspan="7">
                                        <div class="empty-state">
                                            <i class="bi bi-building"></i>
                                            <p th:text="#{admin.vendors.table.no_vendors}">No vendors added yet.</p>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="client : ${clients}"
                                    th:attr="data-search=${(client.companyName ?: '') + ' ' + (client.gstNumber ?: '') + ' ' + (client.email ?: '')}">
                                    <td th:text="${client.id}"></td>
                                    <td class="fw-semibold" th:text="${client.companyName}"></td>
                                    <td th:text="${client.gstNumber}"></td>
                                    <td th:text="${client.email}"></td>
                                    <td th:text="${client.phone}"></td>
                                    <td th:text="${client.address}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/clients/{id}(id=${client.id})}" class="btn btn-sm btn-outline-info"
                                                th:title="#{admin.clients.table.view}"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/clients/{id}/edit(id=${client.id})}"
                                                class="btn btn-sm btn-outline-warning" th:title="#{admin.clients.table.edit}"><i
                                                    class="bi bi-pencil"></i></a>
                                            <form th:action="@{/deleteClient/{id}(id=${client.id})}" method="post"
                                                style="display: inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{admin.clients.table.delete}"
                                                    onclick="return confirm('Delete this vendor?');"><i
                                                        class="bi bi-trash"></i></button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/layout :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/portal.js}"></script>
</body>

</html>
