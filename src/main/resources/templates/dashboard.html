<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Dashboard')"></div>
<div th:replace="fragments/layout :: sidebarMobile('reports')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('reports')"></div>
    <main class="portal-main">
        <h1 class="portal-heading">Finance Dashboard</h1>
        <p class="text-muted">Executive overview of billing workflow performance.</p>
        <div class="row g-3">
            <div class="col-md-3"><div class="card stat-card"><div class="card-body"><div class="stat-label">Total invoices</div><div class="stat-value">1,284</div></div></div></div>
            <div class="col-md-3"><div class="card stat-card"><div class="card-body"><div class="stat-label">Pending</div><div class="stat-value text-warning">164</div></div></div></div>
            <div class="col-md-3"><div class="card stat-card"><div class="card-body"><div class="stat-label">Approved</div><div class="stat-value text-success">972</div></div></div></div>
            <div class="col-md-3"><div class="card stat-card"><div class="card-body"><div class="stat-label">Total amount</div><div class="stat-value">9.8M</div></div></div></div>
        </div>
        <div class="card portal-card mt-4"><div class="card-body"><h2 class="section-title">Recent Uploads</h2><p class="text-muted mb-0">Use this page as a dashboard shell and wire backend metrics when ready.</p></div></div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
