<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{invoice.title}">InvoiceHub - Billing Intake</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>

<body class="portal-bg">

    <div th:replace="fragments/layout :: topbar(#{invoice.heading})"></div>
    <div th:replace="fragments/layout :: sidebarMobile('billing')"></div>

    <div class="portal-shell">
        <div th:replace="fragments/layout :: sidebar('billing')"></div>

        <main class="portal-main">
            <!-- Page Header -->
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
                <div>
                    <h1 class="portal-heading mb-1" th:text="#{invoice.heading}">Billing Intake</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-0">
                            <li class="breadcrumb-item"><a href="/dashboard"
                                    th:text="#{invoice.breadcrumb.portal}">Portal</a></li>
                            <li class="breadcrumb-item active" aria-current="page"
                                th:text="#{invoice.breadcrumb.billing}">Billing Intake</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex gap-2">
                    <a href="/clients" class="btn btn-light border" sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-building"></i> <span th:text="#{invoice.clients.btn}">Clients</span>
                    </a>
                </div>
            </div>

            <!-- Billing Work List Card -->
            <div class="card portal-card mb-4">
                <div class="card-body">
                    <!-- Compact Status Filter Tabs with Counts (1.7.2 design tokens) -->
                    <div class="status-tabs-container" id="statusTabsBar">
                        <button type="button" class="status-tab-btn status-tab-all active" data-status="ALL">
                            <span th:text="#{invoice.tabs.all}">All</span>
                            <span class="status-tab-count" th:text="${statusCounts['ALL'] ?: #lists.size(invoices)}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-pending" data-status="Pending">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.pending}">Pending</span>
                            <span class="status-tab-count" th:text="${statusCounts['Pending'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-in-progress" data-status="In Progress">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.in_progress}">In Progress</span>
                            <span class="status-tab-count" th:text="${statusCounts['In Progress'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-revised" data-status="Revised">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.revised}">Revised</span>
                            <span class="status-tab-count" th:text="${statusCounts['Revised'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-approved" data-status="Approved">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.approved}">Approved</span>
                            <span class="status-tab-count" th:text="${statusCounts['Approved'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-partially-paid" data-status="Partially Paid">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.partially_paid}">Partially Paid</span>
                            <span class="status-tab-count" th:text="${statusCounts['Partially Paid'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-paid" data-status="Released">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.paid_released}">Paid / Released</span>
                            <span class="status-tab-count" th:text="${statusCounts['Released'] ?: 0}">0</span>
                        </button>
                        <button type="button" class="status-tab-btn status-tab-rejected" data-status="Rejected">
                            <span class="status-pill-dot"></span>
                            <span th:text="#{invoice.tabs.rejected}">Rejected</span>
                            <span class="status-tab-count" th:text="${statusCounts['Rejected'] ?: 0}">0</span>
                        </button>
                    </div>

                    <!-- Search and Date Filter Toolbar -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
                        <h2 class="section-title mb-0" th:text="#{invoice.section.uploaded}">Uploaded Billings</h2>
                        <div class="d-flex flex-wrap gap-2 w-100 w-md-auto align-items-center">
                            <div class="input-group" style="max-width: 280px;">
                                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                                <input id="invoiceSearchInput" type="search" class="form-control border-start-0"
                                       th:placeholder="#{invoice.search.placeholder}">
                            </div>
                            <div class="input-group" style="max-width: 175px;">
                                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-calendar"></i></span>
                                <input id="invoiceDateFilter" type="date" class="form-control border-start-0" th:title="#{invoice.filter.date}">
                            </div>
                            <button id="resetFiltersBtn" type="button" class="btn btn-outline-secondary btn-sm" th:title="#{invoice.filter.reset}">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Work List Table -->
                    <div class="table-responsive">
                        <table class="table align-middle portal-table" id="billingTable">
                            <thead>
                                <tr>
                                    <th th:text="#{invoice.table.id}">ID</th>
                                    <th th:text="#{invoice.table.number}">Invoice Number</th>
                                    <th th:text="#{invoice.table.poNumber}">PO Number</th>
                                    <th th:text="#{invoice.table.date}">Date</th>
                                    <th class="text-end th-amount" th:text="#{invoice.table.amount}">Amount</th>
                                    <th th:text="#{invoice.table.client}">Client</th>
                                    <th th:text="#{invoice.table.status}">Status</th>
                                    <th class="text-end" th:text="#{invoice.table.action}">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(invoices)}" class="table-empty-row">
                                    <td colspan="8">
                                        <div class="empty-state">
                                            <i class="bi bi-inbox"></i>
                                            <p th:text="#{invoice.empty}">No uploaded billings yet.</p>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:each="invoice : ${invoices}"
                                    th:attr="data-search=${(invoice.invoiceNumber != null ? invoice.invoiceNumber : '') + ' ' + (invoice.poNumber != null ? invoice.poNumber : '') + ' ' + (invoice.client != null ? invoice.client.companyName : '')},data-amount=${invoice.amount != null ? invoice.amount : 0},data-status=${invoice.status != null ? invoice.status : 'Pending'},data-date=${invoice.invoiceDate != null ? invoice.invoiceDate.toString() : ''}">
                                    <td class="tabular-nums" th:text="${invoice.id}"></td>
                                    <td class="tabular-nums fw-semibold" th:text="${invoice.invoiceNumber}"></td>
                                    <td class="tabular-nums text-muted"
                                        th:text="${invoice.poNumber != null and !invoice.poNumber.isEmpty() ? invoice.poNumber : '-'}">
                                    </td>
                                    <td class="tabular-nums text-nowrap" th:text="${invoice.invoiceDate}"></td>
                                    <td class="text-end tabular-nums fw-medium"
                                        th:text="${T(com.billing.invoicehub.util.FormatUtils).formatAmount(invoice.amount, invoice.currency)}">
                                    </td>
                                    <td th:text="${invoice.client != null ? invoice.client.companyName : '-'}"></td>
                                    <td>
                                        <span th:switch="${(invoice.status != null ? invoice.status : 'Pending').trim().toLowerCase()}">
                                            <span th:case="'pending'" class="status-pill status-pill-pending"
                                                  th:text="#{invoice.filter.pending}">Pending</span>
                                            <span th:case="'in progress'" class="status-pill status-pill-in-progress"
                                                  th:text="#{invoice.filter.in_progress}">In Progress</span>
                                            <span th:case="'approved'" class="status-pill status-pill-approved"
                                                  th:text="#{invoice.filter.approved}">Approved</span>
                                            <span th:case="'partially paid'" class="status-pill status-pill-partially-paid"
                                                  th:text="#{invoice.filter.partially_paid}">Partially Paid</span>
                                            <span th:case="'revised'" class="status-pill status-pill-revised"
                                                  th:text="#{invoice.filter.revised}">Revised</span>
                                            <span th:case="'released'" class="status-pill status-pill-paid"
                                                  th:text="#{invoice.filter.released}">Released</span>
                                            <span th:case="'paid'" class="status-pill status-pill-paid"
                                                  th:text="#{invoice.tabs.paid_released}">Paid</span>
                                            <span th:case="'rejected'" class="status-pill status-pill-rejected"
                                                  th:text="#{invoice.filter.rejected}">Rejected</span>
                                            <span th:case="*" class="status-pill status-pill-neutral"
                                                  th:text="${invoice.status != null ? invoice.status : 'Pending'}">Pending</span>
                                        </span>
                                    </td>
                                    <td class="text-nowrap text-end">
                                        <div class="d-inline-flex align-items-center gap-1">
                                            <a th:href="@{/invoice/{id}(id=${invoice.id})}"
                                               class="btn btn-sm btn-outline-primary" th:title="#{common.view}">
                                                <i class="bi bi-eye"></i> <span class="d-none d-sm-inline" th:text="#{common.view}">View</span>
                                            </a>
                                            <div class="dropdown d-inline-block">
                                                <button class="btn btn-row-action" type="button" data-bs-toggle="dropdown" aria-expanded="false" th:title="#{common.more_actions}">
                                                    <i class="bi bi-three-dots"></i>
                                                </button>
                                                <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                                                    <li>
                                                        <a th:href="@{/invoice/{id}/edit(id=${invoice.id})}"
                                                           class="dropdown-item d-flex align-items-center gap-2">
                                                            <i class="bi bi-pencil text-warning"></i>
                                                            <span th:text="#{common.edit}">Edit</span>
                                                        </a>
                                                    </li>
                                                    <li th:if="${(invoice.status ?: 'Pending') == 'Pending'}">
                                                        <hr class="dropdown-divider">
                                                    </li>
                                                    <li th:if="${(invoice.status ?: 'Pending') == 'Pending'}">
                                                        <form th:action="@{/deleteInvoice/{id}(id=${invoice.id})}"
                                                              method="post" class="m-0 p-0">
                                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                                   th:value="${_csrf.token}">
                                                            <button type="submit" class="dropdown-item text-danger d-flex align-items-center gap-2"
                                                                    th:data-confirm="#{invoice.detail.confirm.delete}"
                                                                    onclick="return confirm(this.getAttribute('data-confirm'));">
                                                                <i class="bi bi-trash"></i>
                                                                <span th:text="#{common.delete}">Delete</span>
                                                            </button>
                                                        </form>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination and Row Counter -->
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mt-3 pt-2 border-top">
                        <small class="text-muted tabular-nums" id="tableCountText" th:text="#{common.showing.all}">Showing all records</small>
                        <div class="btn-group" role="group" aria-label="Pagination">
                            <button class="btn btn-outline-secondary btn-sm" id="prevPageBtn" type="button"
                                th:text="#{common.prev}">Prev</button>
                            <button class="btn btn-outline-secondary btn-sm" id="nextPageBtn" type="button"
                                th:text="#{common.next}">Next</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1080">
        <div id="portalToast" class="toast align-items-center text-bg-primary border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="portalToastText" th:text="#{common.done}">Done</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden"
                th:text="#{common.loading}">Loading...</span></div>
    </div>

    <div id="flashSuccess" th:if="${message}" th:text="${message}" class="d-none"></div>
    <div id="flashError" th:if="${error}" th:text="${error}" class="d-none"></div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Work List Client Filtering & Pagination Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const table = document.getElementById('billingTable');
            const searchInput = document.getElementById('invoiceSearchInput');
            const dateInput = document.getElementById('invoiceDateFilter');
            const resetBtn = document.getElementById('resetFiltersBtn');
            const countText = document.getElementById('tableCountText');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const tabsBar = document.getElementById('statusTabsBar');

            if (!table) return;

            const allRows = Array.from(table.querySelectorAll('tbody tr')).filter(r => !r.classList.contains('table-empty-row'));
            const pageSize = 10;
            let currentPage = 1;
            let currentStatus = 'ALL';

            // 1. Check URL for status parameter (e.g. ?status=Pending)
            const urlParams = new URLSearchParams(window.location.search);
            const initialStatusParam = urlParams.get('status');
            if (initialStatusParam) {
                currentStatus = initialStatusParam;
            }

            // Sync active tab button based on currentStatus
            function syncActiveTab() {
                if (!tabsBar) return;
                const buttons = tabsBar.querySelectorAll('.status-tab-btn');
                buttons.forEach(btn => {
                    const btnStatus = btn.getAttribute('data-status');
                    const isMatch = (btnStatus.toLowerCase() === currentStatus.toLowerCase()) ||
                                    (currentStatus.toLowerCase() === 'all' && btnStatus === 'ALL') ||
                                    ((currentStatus.toLowerCase() === 'paid' || currentStatus.toLowerCase() === 'released') && btnStatus === 'Released');
                    if (isMatch) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            function updateUrlStatus(status) {
                const url = new URL(window.location);
                if (status === 'ALL') {
                    url.searchParams.delete('status');
                } else {
                    url.searchParams.set('status', status);
                }
                window.history.replaceState({}, '', url);
            }

            function matchesStatus(rowStatus, filterStatus) {
                if (!filterStatus || filterStatus === 'ALL') return true;
                const r = (rowStatus || '').trim().toLowerCase();
                const f = filterStatus.trim().toLowerCase();
                if (f === 'released' || f === 'paid') {
                    return r === 'released' || r === 'paid' || r === 'resolved';
                }
                if (f === 'pending') {
                    return r === 'pending' || r === 'open';
                }
                if (f === 'revised') {
                    return r === 'revised' || r === 'revise';
                }
                if (f === 'rejected') {
                    return r === 'rejected' || r === 'cancel' || r === 'cancelled';
                }
                return r === f;
            }

            function getFilteredRows() {
                const searchTerm = (searchInput ? searchInput.value : '').toLowerCase().trim();
                const dateFilter = (dateInput ? dateInput.value : '').trim();

                return allRows.filter(row => {
                    const rowSearch = (row.getAttribute('data-search') || '').toLowerCase();
                    const rowStatus = row.getAttribute('data-status') || '';
                    const rowDate = row.getAttribute('data-date') || '';

                    const statusOk = matchesStatus(rowStatus, currentStatus);
                    const searchOk = !searchTerm || rowSearch.includes(searchTerm);
                    const dateOk = !dateFilter || rowDate === dateFilter;

                    return statusOk && searchOk && dateOk;
                });
            }

            function renderTable() {
                const filtered = getFilteredRows();
                const total = filtered.length;
                const totalPages = Math.max(1, Math.ceil(total / pageSize));

                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * pageSize;
                const end = start + pageSize;

                allRows.forEach(row => {
                    row.style.display = 'none';
                });

                filtered.forEach((row, idx) => {
                    if (idx >= start && idx < end) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });

                if (countText) {
                    if (total === 0) {
                        countText.textContent = 'Showing 0 records';
                    } else {
                        const showStart = start + 1;
                        const showEnd = Math.min(end, total);
                        countText.textContent = 'Showing ' + showStart + '-' + showEnd + ' of ' + total + ' record(s)';
                    }
                }

                if (prevBtn) prevBtn.disabled = (currentPage <= 1);
                if (nextBtn) nextBtn.disabled = (currentPage >= totalPages);
            }

            // Tab click handling
            if (tabsBar) {
                tabsBar.addEventListener('click', function (e) {
                    const btn = e.target.closest('.status-tab-btn');
                    if (!btn) return;
                    currentStatus = btn.getAttribute('data-status') || 'ALL';
                    syncActiveTab();
                    updateUrlStatus(currentStatus);
                    currentPage = 1;
                    renderTable();
                });
            }

            // Search input
            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    currentPage = 1;
                    renderTable();
                });
            }

            // Date filter
            if (dateInput) {
                dateInput.addEventListener('change', function () {
                    currentPage = 1;
                    renderTable();
                });
            }

            // Reset button
            if (resetBtn) {
                resetBtn.addEventListener('click', function () {
                    if (searchInput) searchInput.value = '';
                    if (dateInput) dateInput.value = '';
                    currentStatus = 'ALL';
                    syncActiveTab();
                    updateUrlStatus('ALL');
                    currentPage = 1;
                    renderTable();
                });
            }

            // Pagination buttons
            if (prevBtn) {
                prevBtn.addEventListener('click', function () {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable();
                    }
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', function () {
                    currentPage++;
                    renderTable();
                });
            }

            // Initial render
            syncActiveTab();
            renderTable();
        });
    </script>
</body>

</html>
