<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Vendor Documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Vendor Verification')"></div>
<div th:replace="fragments/layout :: sidebarMobile('vendors')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('vendors')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-3 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Vendor Documents</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin/vendors">Vendor Verification</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${vendor.companyName != null ? vendor.companyName : vendor.username}">Vendor</li>
                    </ol>
                </nav>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-lg-7">
                <div class="card portal-card h-100">
                    <div class="card-body">
                        <h2 class="section-title mb-3">Vendor Profile</h2>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="text-muted small">Company Name</label><p class="fw-semibold" th:text="${vendor.companyName != null ? vendor.companyName : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Full Name</label><p class="fw-semibold" th:text="${vendor.fullName != null ? vendor.fullName : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Email</label><p class="fw-semibold" th:text="${vendor.email != null ? vendor.email : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Phone</label><p class="fw-semibold" th:text="${vendor.phone != null ? vendor.phone : '-'}">-</p></div>
                            <div class="col-12"><label class="text-muted small">Address</label><p class="fw-semibold" th:text="${vendor.address != null ? vendor.address : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">GST Number</label><p class="fw-semibold" th:text="${vendor.gstNumber != null ? vendor.gstNumber : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Vendor Code</label><p class="fw-semibold" th:text="${vendor.vendorCode != null ? vendor.vendorCode : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Registration Date</label><p class="fw-semibold" th:text="${vendor.registrationDate != null ? #temporals.format(vendor.registrationDate, 'MMM dd, yyyy hh:mm a') : '-'}">-</p></div>
                            <div class="col-md-6"><label class="text-muted small">Status</label><p class="fw-semibold"><span th:if="${vendor.verified}" class="badge bg-success">Verified</span><span th:if="${!vendor.verified and vendor.rejectionReason != null and !vendor.rejectionReason.isBlank()}" class="badge bg-danger">Rejected</span><span th:if="${!vendor.verified and (vendor.rejectionReason == null or vendor.rejectionReason.isBlank())}" class="badge bg-warning text-dark">Pending</span></p></div>
                            <div class="col-12" th:if="${vendor.rejectionReason != null and !vendor.rejectionReason.isBlank()}"><label class="text-muted small">Rejection Reason</label><p class="fw-semibold text-danger" th:text="${vendor.rejectionReason}">-</p></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card portal-card mb-3">
                    <div class="card-body">
                        <h2 class="section-title mb-3">Documents</h2>
                        <div class="vstack gap-3">
                            <div><label class="text-muted small d-block">GST Document</label><span th:if="${vendor.gstDocumentUrl == null or vendor.gstDocumentUrl.isBlank()}" class="text-muted">Not uploaded</span><a th:if="${vendor.gstDocumentUrl != null and !vendor.gstDocumentUrl.isBlank() and vendor.gstDocumentUrl.startsWith('http')}" class="btn btn-outline-primary btn-sm" th:href="${vendor.gstDocumentUrl}" target="_blank"><i class="bi bi-eye"></i> View GST Document</a></div>
                            <div><label class="text-muted small d-block">Company Registration Document</label><span th:if="${vendor.companyDocumentUrl == null or vendor.companyDocumentUrl.isBlank()}" class="text-muted">Not uploaded</span><a th:if="${vendor.companyDocumentUrl != null and !vendor.companyDocumentUrl.isBlank() and vendor.companyDocumentUrl.startsWith('http')}" class="btn btn-outline-primary btn-sm" th:href="${vendor.companyDocumentUrl}" target="_blank"><i class="bi bi-eye"></i> View Company Document</a></div>
                            <div><label class="text-muted small d-block">Supporting Document</label><span th:if="${vendor.supportingDocumentUrl == null or vendor.supportingDocumentUrl.isBlank()}" class="text-muted">Optional / not uploaded</span><a th:if="${vendor.supportingDocumentUrl != null and !vendor.supportingDocumentUrl.isBlank() and vendor.supportingDocumentUrl.startsWith('http')}" class="btn btn-outline-primary btn-sm" th:href="${vendor.supportingDocumentUrl}" target="_blank"><i class="bi bi-eye"></i> View Supporting Document</a></div>
                        </div>
                    </div>
                </div>
                <div class="card portal-card">
                    <div class="card-body">
                        <h2 class="section-title mb-3">Reject Vendor</h2>
                        <form th:action="@{/admin/vendors/{id}/reject(id=${vendor.id})}" method="post" class="vstack gap-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div>
                                <label class="form-label">Reason</label>
                                <textarea name="reason" class="form-control" rows="4" placeholder="Explain what needs to be corrected" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger"><i class="bi bi-x-lg"></i> Reject Vendor</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
