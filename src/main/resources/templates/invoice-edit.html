<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Invoice - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Edit Invoice')"></div>
<div th:replace="fragments/layout :: sidebarMobile('billing')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('billing')"></div>
    <main class="portal-main">
        <div class="d-flex justify-content-between mb-3 gap-2">
            <h1 class="portal-heading mb-1">Edit Invoice</h1>
            <a href="/invoice" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
        </div>
        <section class="card portal-card mb-4">
            <div class="card-body">
                <form th:action="@{/updateInvoice}" method="post" enctype="multipart/form-data" class="row g-3">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="${invoice.id}">
                    <div class="col-md-6">
                        <label class="form-label">Invoice Number</label>
                        <input type="text" name="invoiceNumber" th:value="${invoice.invoiceNumber}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Invoice Date</label>
                        <input type="date" name="invoiceDate" th:value="${invoice.invoiceDate}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Amount (Rp)</label>
                        <input type="number" name="amount" th:value="${invoice.amount}" class="form-control" step="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Client</label>
                        <select name="client.id" class="form-control" required>
                            <option value="">-- Select Client --</option>
                            <option th:each="client : ${clients}" th:value="${client.id}" th:selected="${invoice.client != null and invoice.client.id == client.id}" th:text="${client.companyName}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Upload New Invoice File (Optional)</label>
                        <input type="file" name="invoiceFile" class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx">
                        <small class="text-muted">Current file: <span th:text="${invoice.fileName}"></span></small>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check"></i> Save</button>
                        <a href="/invoice" class="btn btn-secondary"><i class="bi bi-x"></i> Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
