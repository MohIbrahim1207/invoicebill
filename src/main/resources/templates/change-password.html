<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{password.change.title}">InvoiceHub - Update Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }
        body.auth-admin-bg {
            background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%);
        }
        .security-card {
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .security-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
    </style>
</head>

<body th:class="${isAdmin} ? 'auth-admin-bg text-dark' : 'portal-bg auth-bg'">
    <!-- Language Switcher container -->
    <div class="position-absolute top-0 end-0 p-3 z-3">
        <div class="dropdown shadow-sm" th:with="currentLang=${#locale.language}">
            <button class="btn btn-light btn-sm dropdown-toggle d-inline-flex align-items-center gap-1" type="button"
                id="languageSelector" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-globe2" aria-hidden="true"></i>
                <span th:text="${currentLang == 'id' ? 'Bahasa Indonesia' : 'English'}">English</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="languageSelector">
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2" href="#"
                        th:classappend="${currentLang != 'id'} ? ' active' : ''"
                        onclick="changeLanguage('en'); return false;">
                        <i class="bi bi-check-lg text-primary" th:classappend="${currentLang == 'id'} ? ' invisible' : ''"></i>
                        <span>English</span>
                    </a>
                </li>
                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2" href="#"
                        th:classappend="${currentLang == 'id'} ? ' active' : ''"
                        onclick="changeLanguage('id'); return false;">
                        <i class="bi bi-check-lg text-primary" th:classappend="${currentLang != 'id'} ? ' invisible' : ''"></i>
                        <span>Bahasa Indonesia</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card security-card bg-white shadow-lg mb-4">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="security-icon mx-auto mb-3">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h1 class="h4 fw-bold mb-1" th:text="#{password.change.heading}">Update Password</h1>
                            <p class="text-muted small mb-0" th:text="#{password.change.subheading}">
                                Please set a new secure password for your account.
                            </p>
                        </div>

                        <!-- Forced Password Change Alert -->
                        <div th:if="${forced}" class="alert alert-warning d-flex align-items-center gap-2 small mb-3">
                            <i class="bi bi-exclamation-triangle-fill fs-5 text-warning flex-shrink-0"></i>
                            <div>
                                <strong th:text="#{password.change.forced.title}">Password Change Required:</strong>
                                <span th:text="#{password.change.forced.message}">An administrator requires you to set a new password before continuing.</span>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div th:if="${errorMessage != null}" class="alert alert-danger small mb-3">
                            <i class="bi bi-x-circle me-1"></i>
                            <span th:text="${errorMessage}">Error changing password.</span>
                        </div>

                        <form th:action="@{${postUrl}}" method="post" class="vstack gap-3" autocomplete="off">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- Current Password -->
                            <div>
                                <label class="form-label fw-semibold small text-secondary" th:text="#{password.change.current}">Current Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" name="currentPassword" id="currentPassword" class="form-control"
                                        th:placeholder="#{password.change.current.placeholder}" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('currentPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- New Password -->
                            <div>
                                <label class="form-label fw-semibold small text-secondary" th:text="#{password.change.new}">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" name="newPassword" id="newPassword" class="form-control"
                                        th:placeholder="#{password.change.new.placeholder}" required autocomplete="new-password">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('newPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Confirm New Password -->
                            <div>
                                <label class="form-label fw-semibold small text-secondary" th:text="#{password.change.confirm}">Confirm New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control"
                                        th:placeholder="#{password.change.confirm.placeholder}" required autocomplete="new-password">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassVisibility('confirmPassword', this)">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="#{password.change.submit}">Update & Continue</span>
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-link text-muted btn-sm text-decoration-none">
                                    <i class="bi bi-box-arrow-left me-1"></i><span th:text="#{password.change.signout}">Cancel and Sign Out</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function changeLanguage(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.assign(url.toString());
        }
    </script>
</body>

</html>
