<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Purchase Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('PO Details')"></div>
<div th:replace="fragments/layout :: sidebarMobile('purchase-orders')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('purchase-orders')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-2">
            <div>
                <h1 class="portal-heading mb-1" th:text="${purchaseOrder.poNumber}"></h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Admin</a></li>
                        <li class="breadcrumb-item"><a href="/admin/purchase-orders">Purchase Orders</a></li>
                        <li class="breadcrumb-item active" th:text="${purchaseOrder.poNumber}"></li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-8">
                <div class="card portal-card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Purchase Order Details</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <p class="text-muted small text-uppercase">PO Number</p>
                                <p class="fw-bold" th:text="${purchaseOrder.poNumber}"></p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small text-uppercase">Status</p>
                                <p>
                                    <span th:if="${purchaseOrder.active}" class="badge bg-success">Active</span>
                                    <span th:if="${!purchaseOrder.active}" class="badge bg-secondary">Inactive</span>
                                </p>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <p class="text-muted small text-uppercase">Vendor</p>
                                <p class="fw-bold" th:text="${purchaseOrder.vendor != null ? purchaseOrder.vendor.username : 'N/A'}"></p>
                            </div>
                            <div class="col-md-6">
                                <p class="text-muted small text-uppercase">PO Amount</p>
                                <p class="fw-bold" th:text="${#numbers.formatDecimal(purchaseOrder.poAmount, 1, 2)}"></p>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <p class="text-muted small text-uppercase">Created At</p>
                                <p class="fw-bold" th:text="${#temporals.format(purchaseOrder.createdAt, 'dd MMM yyyy HH:mm')}"></p>
                            </div>
                        </div>

                        <div th:if="${purchaseOrder.description}" class="mb-3">
                            <p class="text-muted small text-uppercase">Description</p>
                            <p th:text="${purchaseOrder.description}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card portal-card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Actions</h5>
                        <a href="/admin/purchase-orders" class="btn btn-outline-secondary w-100 mb-2">
                            <i class="bi bi-arrow-left"></i> Back to List
                        </a>
                        <form th:if="${purchaseOrder.active}" th:action="@{/admin/purchase-orders/{id}/deactivate(id=${purchaseOrder.id})}" method="post">
                            <button type="submit" class="btn btn-danger w-100" onclick="return confirm('Deactivate this PO?')">
                                <i class="bi bi-x-circle"></i> Deactivate PO
                            </button>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
