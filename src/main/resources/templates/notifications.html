<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{notification.title}">Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar(#{notification.heading})"></div>
<div th:replace="fragments/layout :: sidebarMobile('notifications')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('notifications')"></div>
    <main class="portal-main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="portal-heading mb-0" th:text="#{notification.heading}">Notifications</h1>
            <form th:action="@{/notifications/mark-all-read}" method="post" th:if="${unreadCount > 0}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-primary btn-sm"><i class="bi bi-check-all"></i> <span th:text="#{notification.mark.all.read}">Mark All as Read</span></button>
            </form>
        </div>

        <div th:if="${unreadCount > 0}" class="alert alert-info mb-4">
            <i class="bi bi-info-circle me-2"></i> <span th:text="#{notification.unread.count(${unreadCount})}">You have unread notification(s)</span>
        </div>

        <div class="card portal-card">
            <div class="list-group list-group-flush" th:if="${!notifications.empty}">
                <div th:each="notification : ${notifications}"
                     class="list-group-item list-group-item-action p-3"
                     th:classappend="${!notification.read} ? 'bg-light' : ''">
                    <div class="d-flex w-100 justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1 fw-bold">
                                <span th:if="${!notification.read}" class="badge bg-primary me-2">New</span>
                                <span th:text="${notification.title}">Notification Title</span>
                            </h6>
                            <p class="mb-1 text-muted" th:text="${notification.message}">Notification message</p>
                            <small class="text-secondary" th:text="${#temporals.format(notification.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>
                        </div>
                        <div class="d-flex gap-2">
                            <form th:if="${!notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-secondary" th:title="#{notification.mark.read}"><i class="bi bi-check2"></i></button>
                            </form>
                            <form th:action="@{/notifications/{id}/delete(id=${notification.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{notification.delete}" th:data-confirm="#{notification.delete.confirm}" onclick="return confirm(this.getAttribute('data-confirm'))"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body text-center py-5 text-muted" th:if="${notifications.empty}">
                <i class="bi bi-bell-slash" style="font-size: 3rem;"></i>
                <p class="mt-3 mb-0" th:text="#{notification.empty}">No notifications yet</p>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
