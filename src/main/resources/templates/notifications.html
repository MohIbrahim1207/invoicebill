<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - InvoiceHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
    <style>
        .filter-nav .nav-link {
            color: var(--portal-text-muted, #666);
            border-radius: 6px;
            padding: 10px 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-nav .nav-link.active {
            background-color: var(--bs-primary-subtle, #e0f2fe);
            color: var(--bs-primary, #0284c7);
        }
        .notif-item {
            border-bottom: 1px solid rgba(0,0,0,0.08);
            transition: background-color 0.2s;
        }
        .notif-item:hover {
            background-color: rgba(0,0,0,0.01);
        }
        .notif-item.unread {
            background-color: var(--bs-light-subtle, #f8fafc);
            border-left: 4px solid var(--bs-primary, #3b82f6);
        }
        .notif-dot {
            height: 8px;
            width: 8px;
            background-color: var(--bs-primary, #3b82f6);
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Notifications')"></div>
<div th:replace="fragments/layout :: sidebarMobile('notifications')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('notifications')"></div>
    <main class="portal-main">
        <div class="container-fluid p-0">
            <!-- CSRF Token -->
            <input type="hidden" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <!-- Filters Sidebar -->
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 filter-nav">
                        <h5 class="fw-bold mb-3 px-2">Filters</h5>
                        <ul class="nav flex-column gap-1">
                            <li class="nav-item">
                                <a class="nav-link" th:classappend="${!unreadOnly} ? 'active' : ''" th:href="@{/notifications(unreadOnly=false)}">
                                    <i class="bi bi-bell"></i> All Notifications
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:classappend="${unreadOnly} ? 'active' : ''" th:href="@{/notifications(unreadOnly=true)}">
                                    <i class="bi bi-envelope"></i> Unread Only
                                    <span class="badge bg-primary ms-auto" th:if="${unreadCount > 0}" th:text="${unreadCount}">0</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Notifications List -->
                <div class="col-md-9">
                    <div class="card border-0 shadow-sm">
                        <!-- Card Header -->
                        <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center py-3">
                            <h4 class="fw-bold mb-0 text-dark-emphasis">Notification Manager</h4>
                            <div class="d-flex gap-2">
                                <button onclick="markAllAsRead()" class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1" th:if="${unreadCount > 0}">
                                    <i class="bi bi-check-all"></i> Mark All as Read
                                </button>
                            </div>
                        </div>

                        <!-- Notifications Items -->
                        <div class="list-group list-group-flush" th:if="${totalItems > 0}">
                            <div th:each="n : ${notificationsPage.content}" 
                                 class="list-group-item p-3 notif-item" 
                                 th:classappend="${!n.read} ? 'unread' : ''" 
                                 th:id="'notif-' + ${n.id}">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div class="flex-grow-1 pe-3">
                                        <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                                            <span class="fw-bold text-dark-emphasis" style="font-size: 0.95rem;" th:text="${n.title}">Notification Title</span>
                                            <span class="badge bg-secondary-subtle text-secondary-emphasis" style="font-size: 0.7rem;" th:text="${n.type}">Type</span>
                                            <span class="notif-dot" th:if="${!n.read}"></span>
                                        </div>
                                        <p class="mb-1 text-muted" style="font-size: 0.88rem; line-height: 1.45;" th:text="${n.message}">Notification message goes here...</p>
                                        <span class="text-secondary small" th:text="${n.relativeTime}">Time</span>
                                    </div>
                                    <div class="d-flex gap-2 align-items-center">
                                        <button th:if="${!n.read}" th:onclick="'markAsRead(' + ${n.id} + ')'" class="btn btn-sm btn-light border" title="Mark as Read">
                                            <i class="bi bi-check2"></i>
                                        </button>
                                        <button th:onclick="'deleteNotification(' + ${n.id} + ')'" class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div class="card-body text-center py-5 text-muted" th:if="${totalItems == 0}">
                            <i class="bi bi-bell-slash text-secondary-emphasis" style="font-size: 3.5rem;"></i>
                            <h5 class="fw-semibold mt-3">No notifications found</h5>
                            <p class="small text-muted">You are all caught up!</p>
                        </div>

                        <!-- Pagination Footer -->
                        <div class="card-footer bg-transparent border-0 py-3" th:if="${totalPages > 1}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination pagination-sm justify-content-center mb-0 gap-1">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/notifications(page=${currentPage - 1}, unreadOnly=${unreadOnly})}">Previous</a>
                                    </li>
                                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == pageNum} ? 'active' : ''">
                                        <a class="page-link" th:href="@{/notifications(page=${pageNum}, unreadOnly=${unreadOnly})}" th:text="${pageNum + 1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled' : ''">
                                        <a class="page-link" th:href="@{/notifications(page=${currentPage + 1}, unreadOnly=${unreadOnly})}">Next</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function getHeaders() {
        const csrfToken = document.getElementById('csrfToken')?.value;
        const headers = { 'Content-Type': 'application/json' };
        if (csrfToken) headers['X-CSRF-TOKEN'] = csrfToken;
        return headers;
    }

    function markAsRead(id) {
        fetch(`/api/notifications/${id}/read`, {
            method: 'POST',
            headers: getHeaders()
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.reload();
            }
        })
        .catch(err => console.error('Error marking read:', err));
    }

    function markAllAsRead() {
        fetch('/api/notifications/read-all', {
            method: 'POST',
            headers: getHeaders()
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.reload();
            }
        })
        .catch(err => console.error('Error marking all read:', err));
    }

    function deleteNotification(id) {
        if (!confirm('Are you sure you want to delete this notification?')) return;
        
        fetch(`/api/notifications/${id}`, {
            method: 'DELETE',
            headers: getHeaders()
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.reload();
            }
        })
        .catch(err => console.error('Error deleting:', err));
    }
</script>
</body>
</html>
