<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Purchase Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Purchase Orders')"></div>
<div th:replace="fragments/layout :: sidebarMobile('purchase-orders')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('purchase-orders')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Purchase Orders</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Admin</a></li>
                        <li class="breadcrumb-item active">Purchase Orders</li>
                    </ol>
                </nav>
            </div>
            <a href="/admin/purchase-orders/create" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Create PO
            </a>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card portal-card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table portal-table align-middle">
                        <thead>
                            <tr>
                                <th>PO Number</th>
                                <th>Vendor</th>
                                <th>Total Amount</th>
                                <th>Paid Amount</th>
                                <th>Balance Amount</th>
                                <th>Payment Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="po : ${purchaseOrders}">
                                <td><strong th:text="${po.poNumber}"></strong></td>
                                <td th:text="${po.vendor != null ? po.vendor.username : 'N/A'}"></td>
                                <td th:text="${#numbers.formatDecimal(po.totalAmount, 1, 2)}"></td>
                                <td th:text="${#numbers.formatDecimal(po.paidAmount, 1, 2)}"></td>
                                <td th:text="${#numbers.formatDecimal(po.balanceAmount, 1, 2)}"></td>
                                <td>
                                    <span th:text="${po.paymentStatus}">
                                        <span th:case="PAID" class="badge bg-success">Paid</span>
                                        <span th:case="PARTIALLY_PAID" class="badge bg-warning text-dark">Partially Paid</span>
                                        <span th:case="*" class="badge bg-secondary">Unpaid</span>
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">
                                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/purchase-orders/{id}(id=${po.id})}">View</a>
                                        <a th:if="${po.balanceAmount > 0}" class="btn btn-sm btn-outline-primary" th:href="@{/admin/purchase-orders/{id}/payments/new(id=${po.id})}">
                                            Record Payment
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${purchaseOrders.isEmpty()}" class="text-center text-muted py-5">
                    <p>No purchase orders found. <a href="/admin/purchase-orders/create">Create one</a></p>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
