<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Purchase Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg">
<div th:replace="fragments/layout :: topbar('Purchase Orders')"></div>
<div th:replace="fragments/layout :: sidebarMobile('purchase-orders')"></div>
<div class="portal-shell">
    <div th:replace="fragments/layout :: sidebar('purchase-orders')"></div>
    <main class="portal-main">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-2">
            <div>
                <h1 class="portal-heading mb-1">Purchase Orders</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Admin</a></li>
                        <li class="breadcrumb-item active">Purchase Orders</li>
                    </ol>
                </nav>
            </div>
            <a href="/admin/purchase-orders/create" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Create PO
            </a>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card portal-card">
            <div class="card-body">
                <table class="table portal-table align-middle">
                    <thead>
                        <tr>
                            <th>PO Number</th>
                            <th>Vendor</th>
                            <th>PO Amount</th>
                            <th>Created At</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="po : ${purchaseOrders}">
                            <td><strong th:text="${po.poNumber}"></strong></td>
                            <td th:text="${po.vendor.username}"></td>
                            <td th:text="${#numbers.formatDecimal(po.poAmount, 1, 2)}"></td>
                            <td th:text="${#temporals.format(po.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${po.active}" class="badge bg-success">Active</span>
                                <span th:if="${!po.active}" class="badge bg-secondary">Inactive</span>
                            </td>
                            <td>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/purchase-orders/{id}(id=${po.id})}">View</a>
                                <form th:if="${po.active}" th:action="@{/admin/purchase-orders/{id}/deactivate(id=${po.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Deactivate this PO?')">Deactivate</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${purchaseOrders.isEmpty()}" class="text-center text-muted py-5">
                    <p>No purchase orders found. <a href="/admin/purchase-orders/create">Create one</a></p>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
