<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{otp.title}">InvoiceHub - Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg auth-bg">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card portal-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3"><i class="bi bi-shield-check"></i></div>
                        <h1 class="h3 fw-bold mb-2" th:text="#{otp.heading}">Verify OTP</h1>
                        <p class="text-muted mb-0" th:text="#{otp.subtitle(${email})}">Enter the OTP</p>
                    </div>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/verify-otp}" method="post" class="vstack gap-3">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="email" th:value="${email}">
                        <div>
                            <label class="form-label" th:text="#{otp.label}">One-Time Password</label>
                            <input type="text" name="otp" class="form-control form-control-lg text-center"
                                   th:placeholder="#{otp.placeholder}" maxlength="6" pattern="[0-9]{6}" required
                                   style="letter-spacing: 0.5rem; font-size: 1.5rem; font-weight: bold;">
                            <small class="text-muted" th:text="#{otp.hint}">Enter the 6-digit code we sent to your email.</small>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-check-lg"></i> <span th:text="#{otp.verify}">Verify OTP</span>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted"><span th:text="#{otp.not.received}">Didn't receive OTP?</span> <a th:href="@{/forgot-password}" th:text="#{otp.request.again}">Request again</a></small>
                    </div>

                    <div class="text-center mt-3">
                        <small class="text-muted"><span th:text="#{otp.remember}">Remember your password?</span> <a th:href="@{/login}" th:text="#{otp.back.login}">Back to login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
