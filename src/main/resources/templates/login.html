<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" href="/flow.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}">InvoiceHub - User Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg auth-bg">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card portal-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3"><i class="bi bi-receipt-cutoff"></i></div>
                        <h1 class="h3 fw-bold mb-2" th:text="#{login.heading}">InvoiceHub Login</h1>
                        <p class="text-muted mb-0" th:text="#{login.subtitle}">Sign in to continue to your billing portal.</p>
                    </div>

                    <div th:if="${param.pendingVerification}" class="alert alert-warning" th:text="#{login.pending.verification}">Your account is pending admin verification.</div>
                    <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">Invalid username or password.</div>
                    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">You have been logged out.</div>
                    <div th:if="${param.access} == 'use_admin'" class="alert alert-warning" th:text="#{login.access.admin}">Access denied. Use the admin login page.</div>
                    <div th:if="${param.denied}" class="alert alert-warning" th:text="#{login.access.denied}">Access denied.</div>

                    <form th:action="@{/login}" method="post" class="vstack gap-3" autocomplete="off">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label" th:text="#{login.username}">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" th:placeholder="#{login.username.placeholder}" autocomplete="username" required>
                        </div>
                        <div>
                            <label class="form-label" th:text="#{login.password}">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" th:placeholder="#{login.password.placeholder}" autocomplete="current-password" required>
                        </div>

                        <div class="d-flex justify-content-end mb-2">
                            <a th:href="@{/forgot-password}" class="text-decoration-none small" th:text="#{login.forgot.password}">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> <span th:text="#{login.signin}">Sign in</span></button>
                    </form>

                    <div class="text-center mt-4">
                         <small class="text-muted"><span th:text="#{login.admin.switch}">Admin login?</span> <a th:href="@{/admin/login}" id="switchLoginLink" th:text="#{login.admin.switch.link}">Switch here</a></small>
                     </div>

                     <div class="text-center mt-3">
                          <small class="text-muted"><span th:text="#{login.no.account}">New to InvoiceHub?</span> <a th:href="@{/register}" th:text="#{login.create.account}">Create an account</a></small>
                     </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        function clearPasswordField() {
            var passwordField = document.querySelector('input[name="password"]');
            if (passwordField) {
                passwordField.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', clearPasswordField);
        window.addEventListener('pageshow', clearPasswordField);
    })();
</script>
</body>
</html>
