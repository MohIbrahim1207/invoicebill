<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InvoiceHub - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body class="portal-bg auth-bg">
<div class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card portal-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
                        <h1 class="h3 fw-bold mb-2">Admin Portal Login</h1>
                        <p class="text-muted mb-0">Sign in as an administrator.</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger">Invalid admin credentials or access denied.</div>
                    <div th:if="${param.denied}" class="alert alert-warning">You do not have permission to access that page.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

                    <form th:action="@{/admin/login}" method="post" class="vstack gap-3" autocomplete="off">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div>
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter admin username" autocomplete="username" required>
                        </div>
                        <div>
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-shield-check"></i> Sign in as Admin</button>
                    </form>

                    <div class="text-center mt-4">
                         <small class="text-muted">User login? <a th:href="@{/login}" id="switchLoginLink">Switch here</a></small>
                     </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        function clearPasswordField() {
            var passwordField = document.querySelector('input[name="password"]');
            if (passwordField) {
                passwordField.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', clearPasswordField);
        window.addEventListener('pageshow', clearPasswordField);
    })();
</script>
</body>
</html>
