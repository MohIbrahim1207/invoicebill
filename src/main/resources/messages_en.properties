help.register.title=How to Register
help.register.intro=If you are a new vendor, you can register on the InvoiceHub platform to start submitting invoices and managing tickets.
help.register.step1.title=Click the Sign Up button
help.register.step1.desc=Visit the InvoiceHub login page and click the "Sign up here" link.
help.register.step2.title=Fill in your information
help.register.step2.desc=Provide your full name, email, phone number, company name, and create a secure password.
help.register.step3.title=Upload required documents
help.register.step3.desc=Submit your company logo, GST document, and other supporting documents as required.
help.register.step4.title=Wait for approval
help.register.step4.desc=Our admin team will review your registration and verify your documents. You will receive an email confirmation once approved.
help.register.step5.title=Start using the portal
help.register.step5.desc=Once approved, you can log in and start submitting invoices and managing your tickets.

help.upload.title=How to Upload an Invoice
help.upload.intro=After your registration is approved, you can submit invoices through the Vendor Ticket List. Each submission creates a new ticket for tracking.
help.upload.step1.title=Navigate to Vendor Tickets
help.upload.step1.desc=From the sidebar, click "Vendor Tickets" to open the ticket list page.
help.upload.step2.title=Click New
help.upload.step2.desc=Click the "New" button on the top right of the Vendor Ticket List to open the invoice submission form.
help.upload.step3.title=Fill in invoice details
help.upload.step3.desc=Enter the Invoice Number, PO Number, Amount, Currency, Invoice Date, Subtotal, and Tax. The Total will be calculated automatically.
help.upload.step4.title=Click Next
help.upload.step4.desc=Once all invoice details are filled in, click the "Next" button to proceed to the document upload step.
help.upload.step5.title=Upload supporting documents
help.upload.step5.desc=Attach all required files including your Invoice copy, Delivery Note, Purchase Order (PO) copy, and any other supporting documents requested.
help.upload.step6.title=Submit your ticket
help.upload.step6.desc=Review all the information and uploaded files, then click "Submit" to send your invoice for admin review.
help.upload.note=Once submitted, a ticket number will be assigned and the status will be set to "Open". You can track the progress anytime from the Vendor Ticket List page.

help.approval.title=How Invoice Approval Works
help.approval.intro=Every invoice you submit goes through a review and approval process. Here's how it works:
help.approval.step1.title=Submitted/Open
help.approval.step1.desc=Your invoice is submitted and waiting for the admin team to review it.
help.approval.step2.title=In Review
help.approval.step2.desc=The admin team is actively reviewing your invoice documents and details.
help.approval.step3.title=Decision Made
help.approval.step3.desc=The admin may approve, reject, or request revisions to your invoice:
help.approval.approved=Your invoice is accepted and processed. You'll receive payment accordingly.
help.approval.rejected=Your invoice was not approved. Check the rejection reason and resubmit a corrected version.
help.approval.revised=Your invoice needs changes. The admin will provide feedback on what needs to be corrected.
help.approval.tip=You'll receive an email notification every time your invoice status changes. You can also check the status from the "Billing Intake" page.

help.status.title=How to Read Your Invoice Status
help.status.intro=Your invoice status is displayed on the "Billing Intake" page. Each invoice shows its current status with a color-coded badge:
help.status.pending=Your invoice has been submitted and is waiting for review.
help.status.approved=Your invoice has been approved and is in the processing queue.
help.status.revised=Your invoice needs corrections. Contact admin or check the feedback.
help.status.released=Your invoice has been processed and released for payment.
help.status.detail=Click on an invoice entry to view the full invoice detail page, which includes the complete ticket history, status changes, and any comments from the admin.

help.contact.title=How to Contact Admin
help.contact.intro=If you have questions or need support, you can reach our admin team using any of the following methods:
help.contact.call=Call us:
help.contact.message=Send a message:
help.contact.message.desc=Use the {0} on the portal to submit your inquiry.
help.contact.form.link=Contact Form
help.contact.response=Our team typically responds to contact form submissions within 24-48 business hours. For urgent matters, please call the helpline.

help.faq.title=Frequently Asked Questions
help.faq.q1=How long does it take to get my registration approved?
help.faq.a1=Typically, vendor registration approval takes 2-5 business days. We review your documents and verify your business information during this time. You'll receive an email notification once your account is approved or if additional information is needed.
help.faq.q2=What file formats are supported for document uploads?
help.faq.a2=We support most common file formats including PDF, JPG, PNG, WEBP, DOC, DOCX, and XLS. The maximum file size is typically 25 MB per file. Ensure your documents are clear and legible for quick review.
help.faq.q3=Can I edit or delete an invoice after I submit it?
help.faq.a3=You can only delete invoices with "Pending" status. Once an invoice is under review (status changed by admin), it cannot be deleted. If you need to make changes, please contact the admin team or resubmit with corrections.
help.faq.q4=What should I do if my invoice is rejected?
help.faq.a4=When an invoice is rejected, check the notification email or the invoice detail page to see the rejection reason. Correct the issues mentioned and resubmit your invoice. If you're unsure about the rejection reason, contact our helpline.
help.faq.q5=How do I track the status of my invoices?
help.faq.a5=All your invoices are listed on the "Billing Intake" page with their current status. You can click on any invoice to view detailed information, status history, and admin comments. You'll also receive email notifications whenever an invoice status changes.
help.faq.q6=What if I don't receive a notification email for status changes?
help.faq.a6=Check your email spam/junk folder as emails may sometimes get filtered. Make sure the email address in your profile is correct. If you still don't receive emails, you can check the notifications section in the portal from the bell icon in the top navigation.
help.faq.q7=Can I view my invoice payment history?
help.faq.a7=Invoice payment information is typically provided through separate communication or reports. For detailed payment history, please contact our admin team or call the helpline.
help.faq.q8=What should I include when submitting an invoice?
help.faq.a8=You should include: (1) Your company details, (2) Invoice number and date, (3) Amount in Indonesian Rupiah (IDR), (4) Bill-to client information, (5) Invoice PDF or scanned copy, and (6) Any supporting documents like tax receipts or delivery proof as required.
help.faq.q9=How do I change my password or update my profile?
help.faq.a9=Password changes and profile updates are currently managed through the admin team. Please contact the helpline with your request, and our team will assist you.
help.faq.q10=What if I have technical issues with the portal?
help.faq.a10=Try clearing your browser cache and cookies, then attempt to access the portal again. If the issue persists, try using a different browser or device. For unresolved technical issues, please contact our support helpline or use the Contact Form.

